<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sky Islands — Flight Club</title>
<style>
  /* Bundled locally so the app never touches the network. */
  @font-face{
    font-family:'Luckiest Guy'; font-style:normal; font-weight:400; font-display:block;
    src:url(fonts/LuckiestGuy-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Luckiest Guy'; font-style:normal; font-weight:400; font-display:block;
    src:url(fonts/LuckiestGuy-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
</style>
<style>
  :root{
    --st: env(safe-area-inset-top,0px);
    --sb: env(safe-area-inset-bottom,0px);
    --sl: env(safe-area-inset-left,0px);
    --sr: env(safe-area-inset-right,0px);
    --ink:#0d1b34;
    --paper:#eaf4ff;
    --panel:rgba(10,24,48,.82);
    --stroke:rgba(255,255,255,.78);
  }
  :root:not([data-theme="light"]){ color-scheme: light dark; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; overflow:hidden; background:#12356b; }
  body{
    font-family:'Luckiest Guy', Impact, 'Arial Black', system-ui, sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  canvas{ display:block; width:100%; height:100%; }

  /* the whole game lives in a landscape stage; if the phone is held
     upright we rotate the stage so the game is always played sideways */
  #stage{ position:fixed; top:0; left:0; transform-origin:0 0; overflow:hidden; }
  body.rot{ --st:10px; --sb:10px; --sl:10px; --sr:10px; }
  #btnAct{
    position:fixed; right:calc(20px + var(--sr)); bottom:calc(142px + var(--sb)); width:104px;
    transform:scale(.85); transform-origin:50% 100%;
    z-index:8; opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
    font-family:inherit; font-size:19px; letter-spacing:1px; color:#fff; padding:9px 0; text-align:center;
    border-radius:14px; border:3px solid #ffe9a8; background:linear-gradient(#3f8f3a,#1d5a2a);
    box-shadow:0 4px 0 #123d1c, 0 8px 18px rgba(0,0,0,.35);
  }
  #btnAct.show{ opacity:1; pointer-events:auto; transform:scale(1); }
  #btnAct:active{ transform:translateY(3px) scale(1); box-shadow:0 2px 0 #123d1c; }
  #shop{
    position:fixed; inset:0; z-index:7; display:flex; flex-direction:column;
    background:linear-gradient(rgba(6,16,36,.94),rgba(4,10,26,.97));
    padding:calc(8px + var(--st)) calc(10px + var(--sr)) calc(8px + var(--sb)) calc(10px + var(--sl));
  }
  #shop.hide{ display:none; }
  .shopbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:2px 2px 8px; }
  .shoptitle{ color:#ffd98a; font-size:19px; text-shadow:0 2px 0 #a3400f; }
  .bank{ display:inline-flex; align-items:center; gap:6px; color:#ffe9a0; font-size:18px; margin-right:auto; }
  .bank i{ width:15px; height:15px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe9a0,#f5a623 55%,#c25a12); display:inline-block; }
  .tab{ font-family:inherit; font-size:15px; color:#cfe4ff; background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.28); border-radius:10px; padding:6px 14px; cursor:pointer; }
  .tab.on{ background:#2f74c4; color:#fff; border-color:#9fd8ec; }
  .closeb{ font-family:inherit; font-size:15px; color:#fff; background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3); border-radius:10px; padding:6px 14px; cursor:pointer; }
  .coderow{ display:flex; align-items:center; gap:8px; padding:0 2px 8px; flex-wrap:wrap; }
  #codeIn{ font-family:inherit; font-size:14px; letter-spacing:1px; color:#fff; width:150px;
    background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.28); border-radius:10px; padding:7px 10px; }
  #codeIn::placeholder{ color:rgba(255,255,255,.45); letter-spacing:0; }
  #codeGo{ font-family:inherit; font-size:14px; color:#fff; padding:7px 16px; border-radius:10px;
    border:2px solid #ffe9a8; background:linear-gradient(#e6902c,#a01f22); cursor:pointer; }
  #codeMsg{ font-family:system-ui,sans-serif; font-size:12px; color:#8ef08a; }
  #codeMsg.bad{ color:#ff9b8a; }
  .list{ flex:1; overflow-y:auto; display:grid; gap:10px; padding:2px 2px 10px;
    grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); align-content:start; }
  .item{ background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.18);
    border-radius:14px; padding:8px; text-align:center; }
  .item.eq{ border-color:#7ee08a; background:rgba(120,230,140,.12); }
  .item canvas{ width:100%; height:auto; border-radius:9px; background:rgba(0,0,0,.25); display:block; }
  .item .nm{ color:#ffe9a0; font-size:15px; margin-top:6px; }
  .item .ds{ font-family:system-ui,sans-serif; font-size:11px; color:#c3d7ef; min-height:26px; margin:2px 0 4px; }
  .bars{ display:flex; gap:4px; justify-content:center; margin-bottom:6px; }
  .bars span{ font-family:system-ui,sans-serif; font-size:9px; color:#9fb8d6; }
  .bars b{ display:inline-block; width:22px; height:5px; border-radius:3px; background:rgba(255,255,255,.18); position:relative; overflow:hidden; }
  .bars b i{ position:absolute; inset:0 auto 0 0; background:#6ee86e; }
  .item button{ width:100%; font-family:inherit; font-size:14px; color:#fff; padding:8px 4px;
    border-radius:10px; border:2px solid #ffe9a8; background:linear-gradient(#e6902c,#a01f22); cursor:pointer; }
  .item button.own{ background:linear-gradient(#3f8f3a,#1d5a2a); }
  .item button:disabled{ opacity:.45; cursor:default; border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.12); }
  #rotate{
    position:fixed; inset:auto 0 12px 0; z-index:9; text-align:center; pointer-events:none;
    font-family:system-ui,sans-serif; font-size:13px; color:rgba(255,255,255,.75);
    text-shadow:0 1px 4px rgba(0,0,0,.6); display:none;
  }
  body.rot #rotate{ display:block; }

  /* ---- Roblox-style touch controls ---- */
  #pad{ position:fixed; inset:auto 0 0 0; pointer-events:none; }
  .rb{
    position:fixed; pointer-events:auto; display:grid; place-items:center;
    border-radius:50%; border:3px solid var(--stroke);
    background:rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    box-shadow:0 4px 14px rgba(0,0,0,.28), inset 0 2px 10px rgba(255,255,255,.35);
    padding:0; touch-action:none; transition:transform .06s ease, background .06s ease;
  }
  .rb svg{ width:52%; height:52%; fill:#fff; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .rb.on{ background:rgba(255,255,255,.5); transform:scale(.93); }
  #btnL{ left:calc(18px + var(--sl)); bottom:calc(28px + var(--sb)); width:76px; height:76px; }
  #btnR{ left:calc(106px + var(--sl)); bottom:calc(28px + var(--sb)); width:76px; height:76px; }
  #btnU{ right:calc(20px + var(--sr)); bottom:calc(24px + var(--sb)); width:104px; height:104px; }

  /* ---- Screens ---- */
  #screen{
    position:fixed; inset:0; display:grid; place-items:center; padding:24px;
    padding-top:calc(24px + var(--st));
    background:radial-gradient(120% 80% at 50% 20%, rgba(8,22,48,.55), rgba(5,14,32,.88));
    z-index:5;
  }
  #screen.hide{ display:none; }
  .card{
    width:min(440px,100%); text-align:center; color:var(--paper);
    background:var(--panel); border:3px solid rgba(255,255,255,.5); border-radius:22px;
    padding:26px 22px 24px; box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .card{ max-height:100%; display:flex; flex-direction:column; overflow:hidden; }
  .card .body{ min-height:0; overflow-y:auto; touch-action:pan-y; -webkit-overflow-scrolling:touch; }
  .card .actions{ flex:none; }
  body.short #screen{ padding:10px; padding-top:calc(10px + var(--st)); }
  body.short .card{ padding:16px 18px 16px; border-radius:18px; }
  body.short .card h1{ font-size:30px; }
  body.short .card h2{ font-size:16px; margin:4px 0 8px; }
  body.short .card p{ margin:4px 0; font-size:13px; }
  body.short .go{ margin-top:12px; font-size:20px; padding:10px 26px; }
  body.short .keys{ margin:10px 0 2px; }
  .card h1{ margin:0; font-size:clamp(30px,9vw,46px); line-height:1; letter-spacing:.5px;
    color:#ffd98a; text-shadow:0 3px 0 #a3400f, 0 6px 16px rgba(0,0,0,.45); }
  .card h2{ margin:6px 0 14px; font-size:clamp(16px,4.6vw,21px); color:#9fd8ec; }
  .card p{ margin:8px 0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.5; color:#d8e8fb; }
  .keys{ display:flex; gap:10px; justify-content:center; margin:16px 0 4px; flex-wrap:wrap; }
  .chip{ font-family:system-ui,sans-serif; font-size:13px; padding:7px 12px; border-radius:999px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); }
  .go{
    margin-top:18px; font-family:inherit; font-size:24px; letter-spacing:1px; color:#fff;
    padding:14px 34px; border-radius:16px; border:3px solid #ffe9a8; cursor:pointer;
    background:linear-gradient(#e6902c,#a01f22); box-shadow:0 6px 0 #6d1114, 0 10px 22px rgba(0,0,0,.4);
  }
  .go.alt{ background:linear-gradient(#3b6fb8,#1d3f74); border-color:#bfe0ff; box-shadow:0 6px 0 #142a4d, 0 10px 22px rgba(0,0,0,.4); margin-left:8px; }
  .go:active{ transform:translateY(3px); box-shadow:0 3px 0 #6d1114; }
  .stat{ font-size:20px; color:#ffd98a; margin-top:10px; }
  @media (prefers-reduced-motion: reduce){ .rb{ transition:none; } }
  /* leaderboard on the game-over card */
  #lb{ margin:8px auto 4px; max-width:420px; font-size:15px; }
  #lb .row{ display:flex; align-items:center; gap:8px; justify-content:center; flex-wrap:wrap; }
  #lb input{ font-family:inherit; font-size:15px; letter-spacing:1px; color:#fff; width:150px;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3); border-radius:10px; padding:6px 10px; }
  #lb button{ font-family:inherit; font-size:15px; color:#fff; background:#2f74c4; border:2px solid #9fd8ec;
    border-radius:10px; padding:6px 14px; cursor:pointer; }
  #lb .msg{ color:#9fc4e6; font-size:13px; margin-top:4px; }
  #lb table{ border-collapse:collapse; margin:4px auto 0; color:#eaf4ff; }
  #lb td{ padding:1px 8px; white-space:nowrap; }
  #lb td.n{ color:#ffd98a; text-align:right; }
  #lb td.s{ color:#ffe9a0; text-align:right; }
  #lb tr.you td{ color:#bfe9ff; }
  #lb tr.you td.n, #lb tr.you td.s{ color:#fff; }
  /* Flight briefing: the gold route line ties missions, hangar and logbook together. */
  button, select, input { touch-action:manipulation; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid #ffd98a; outline-offset:3px; }
  button { min-height:44px; }
  .card.briefing { width:min(800px,100%); text-align:left; }
  .brief-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; }
  .brief-grid > section + section { border-left:2px solid #eab65b; padding-left:20px; }
  .card h3 { font-size:19px; margin:0 0 9px; color:#ffd98a; font-weight:400; }
  .card .intro { color:#b3d9ee; margin:9px 0 14px; }
  .flight-choice { display:flex; gap:8px; flex-wrap:wrap; }
  .flight-choice button, .minor { font:14px system-ui,sans-serif; font-weight:650; border:1px solid #7192b6; color:#eaf4ff; background:#173458; border-radius:9px; padding:9px 12px; cursor:pointer; }
  .flight-choice button.selected { background:#ffd98a; color:#12356b; border-color:#ffd98a; }
  .brief-footer { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  .brief-footer .go { margin:0; flex:1; font-size:20px; padding:10px 18px; }
  .mission { font:13px/1.35 system-ui,sans-serif; padding:8px 0; border-bottom:1px solid #456080; }
  .mission b { color:#fff; } .mission span { float:right; color:#ffd98a; }
  .mission progress { width:100%; height:6px; display:block; margin-top:5px; accent-color:#ffd98a; }
  .small-note { font:12px/1.45 system-ui,sans-serif; color:#a8cbe4; }
  #flightBar { position:absolute; top:calc(8px + var(--st)); left:50%; transform:translateX(-50%); z-index:4; display:flex; gap:8px; }
  #pauseBtn { background:rgba(10,24,48,.85); color:white; border:1px solid #a8cbe4; border-radius:10px; padding:8px 15px; font:15px system-ui,sans-serif; }
  #flightBar.hide, #tutorialHint.hide, #panel.hide { display:none; }
  #tutorialHint { position:absolute; top:calc(56px + var(--st)); left:50%; transform:translateX(-50%); width:min(420px,65%); background:rgba(10,24,48,.94); border-left:4px solid #ffd98a; padding:9px 14px; color:white; font:14px/1.4 system-ui,sans-serif; z-index:4; pointer-events:none; }
  #panel { position:absolute; inset:0; z-index:10; display:grid; place-items:center; padding:calc(10px + var(--st)) calc(14px + var(--sr)) calc(10px + var(--sb)) calc(14px + var(--sl)); background:rgba(5,14,32,.87); }
  .panel-card { width:min(760px,100%); max-height:100%; overflow-y:auto; touch-action:pan-y; background:#102b4d; color:#eaf4ff; border:2px solid #749cc1; border-radius:18px; padding:18px 22px; }
  .panel-head { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:12px; }
  .panel-head h2 { margin:0; color:#ffd98a; font-size:26px; font-weight:400; }
  .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px 24px; font:14px system-ui,sans-serif; }
  .setting { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; }
  .setting input[type=checkbox] { width:24px; height:24px; accent-color:#ffd98a; }
  .setting input[type=range] { width:120px; accent-color:#ffd98a; }
  .setting select, #ghostChoice { border:1px solid #7e9dbb; border-radius:7px; padding:8px; background:#173458; color:#fff; max-width:180px; font:14px system-ui,sans-serif; min-height:44px; }
  .log-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; font:13px/1.4 system-ui,sans-serif; }
  .log-entry { border-bottom:2px solid #456080; padding:8px; }
  .log-entry strong { color:#ffd98a; } .log-entry.locked { opacity:.65; }
  .landmark-icon { font-size:28px; display:block; color:#bce6f6; }
  .control-preview { margin:14px 0; padding:12px; border:1px dashed #7e9dbb; font:13px system-ui,sans-serif; }
  .reduced-motion *, .reduced-motion *::before { transition:none!important; animation:none!important; }
  #btnL, #btnR { width:var(--small-control,76px); height:var(--small-control,76px); bottom:calc(var(--control-bottom,24px) + var(--sb)); }
  #btnL { left:calc(18px + var(--sl)); }
  #btnR { left:calc(30px + var(--small-control,76px) + var(--sl)); }
  #btnU { width:var(--large-control,96px); height:var(--large-control,96px); bottom:calc(var(--control-bottom,24px) + var(--sb)); }
  #btnAct { bottom:calc(var(--control-bottom,24px) + var(--large-control,96px) + 10px + var(--sb)); min-height:44px; }
  .left-handed #btnU { left:calc(20px + var(--sl)); right:auto; }
  .left-handed #btnL { right:calc(30px + var(--small-control,76px) + var(--sr)); left:auto; }
  .left-handed #btnR { right:calc(18px + var(--sr)); left:auto; }
  .left-handed #btnAct { left:calc(16px + var(--sl)); right:auto; }
  body.short .card.briefing { padding:14px 18px; }
  body.short .briefing .go { margin-top:0; font-size:19px; padding:9px 16px; }
  body.short .briefing h1 { font-size:34px; }
  @media(max-height:360px) { .brief-grid { gap:12px; } .mission { padding:4px 0; } .brief-footer { margin-top:8px; } }
</style>
</head>
<body>
<div id="safeProbe" style="position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);pointer-events:none;opacity:0"></div>

<div id="stage">
<canvas id="c"></canvas>

<div id="pad">
  <button class="rb" id="btnL" aria-label="Slow down">
    <svg viewBox="0 0 24 24"><path d="M15.5 3.8 7.9 11a1.4 1.4 0 0 0 0 2l7.6 7.2c.9.8 2.3.2 2.3-1V4.8c0-1.2-1.4-1.8-2.3-1z"/></svg>
  </button>
  <button class="rb" id="btnR" aria-label="Speed up">
    <svg viewBox="0 0 24 24"><path d="M8.5 3.8 16.1 11a1.4 1.4 0 0 1 0 2l-7.6 7.2c-.9.8-2.3.2-2.3-1V4.8c0-1.2 1.4-1.8 2.3-1z"/></svg>
  </button>
  <button class="rb" id="btnU" aria-label="Climb">
    <svg viewBox="0 0 24 24"><path d="M3.8 15.5 11 7.9a1.4 1.4 0 0 1 2 0l7.2 7.6c.8.9.2 2.3-1 2.3H4.8c-1.2 0-1.8-1.4-1-2.3z"/></svg>
  </button>
</div>

<div id="screen">
  <div class="card" id="card"></div>
</div>

<button id="btnAct">LAND</button>
<div id="flightBar" class="hide"><button id="pauseBtn" aria-label="Pause flight">Ⅱ Pause</button></div>
<div id="tutorialHint" class="hide" aria-live="polite"></div>
<div id="panel" class="hide" role="dialog" aria-modal="true" aria-label="Flight menu"><div class="panel-card" id="panelBody"></div></div>

<div id="shop" class="hide">
  <div class="shopbar">
    <span class="shoptitle">Hangar &amp; Shop</span>
    <span class="bank"><i></i><span id="shopGold">0</span></span>
    <button class="tab on" data-tab="planes">Planes</button>
    <button class="tab" data-tab="islands">Islands</button>
    <button id="shopClose" class="closeb">Close</button>
  </div>
  <div class="coderow">
    <input id="codeIn" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Secret code">
    <button id="codeGo">Enter</button>
    <span id="codeMsg" aria-live="polite"></span>
    <span class="small-note">Free Flight cheat codes · disabled in Daily Race</span>
  </div>
  <div id="shopList" class="list"></div>
</div>

<div id="rotate">Turn your phone sideways for the full screen</div>
</div>

<script>
(() => {
"use strict";

// ---------- canvas ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const CTX = ctx;
let W = 0, H = 0, DPR = 1, seaY = 0, ceilY = 0, jetX = 0, skyTop = 0;
let safeInsets={left:0,right:0,top:0};
let ZOOM = 0.8;   // view scale: < 1 shows more of the world

const stage = document.getElementById('stage');
let rotated = false;

function layoutStage(){
  const vw = window.innerWidth, vh = window.innerHeight;
  rotated = vh > vw;                       // phone held upright -> rotate the stage
  document.body.classList.toggle('rot', rotated);
  if(rotated){
    stage.style.width = vh + 'px';
    stage.style.height = vw + 'px';
    stage.style.transform = 'rotate(90deg) translate(0px,' + (-vw) + 'px)';
  } else {
    stage.style.width = vw + 'px';
    stage.style.height = vh + 'px';
    stage.style.transform = 'none';
  }
  document.body.classList.toggle('short', Math.min(vw,vh) < 460);
}

function resize(){
  layoutStage();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  // Fixed world height and pilot position keep daily geometry identical on every phone.
  H = 491.25; ZOOM = stage.clientHeight / H; W = stage.clientWidth / ZOOM;
  cvs.width = Math.floor(stage.clientWidth * DPR); cvs.height = Math.floor(stage.clientHeight * DPR);
  ctx.setTransform(DPR * ZOOM, 0, 0, DPR * ZOOM, 0, 0);
  seaY = H * 0.855;
  skyTop = -H * 1.15;          // the stratosphere, about one screen above the clouds
  ceilY = skyTop + 26;
  jetX = 260;
  sceneryCache.clear();
  const insets=getComputedStyle(document.getElementById('safeProbe'));
  safeInsets={left:(parseFloat(insets.paddingLeft)||0)/ZOOM,right:(parseFloat(insets.paddingRight)||0)/ZOOM,top:(parseFloat(insets.height)||0)/ZOOM};
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ---------- helpers ----------
const probe = document.getElementById('safeProbe');
function safeTopPx(){ return rotated?10/ZOOM:safeInsets.top; }
function safeTop(){ return safeTopPx(); }
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b-a)*t;
// ---------- daily course ----------
// Every pilot flies the same course on a given UTC day, so runs can be compared and
// replayed as ghosts. Each generator gets its own RNG stream so the world does not
// depend on how far ahead a particular screen size forces generation.
function courseId(){
  const d = new Date();
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
}
function hashStr(str){ let h = 2166136261; for(let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function altOf(y){ return (seaY - y) / (seaY - skyTop); }
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

const HAPTICS = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) || null;
function haptic(style){
  if(!HAPTICS || !SAVE.settings.haptics) return;
  try{ HAPTICS.impact({ style: style || 'LIGHT' }).catch(()=>{}); }catch(e){}
}

// ---------- audio (tiny blips) ----------
let AC = null;
function unlockAudio(){
  if(!SAVE.settings.sound) return;
  try { if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if(AC.state === 'suspended') AC.resume().catch(()=>{}); } catch(e){}
}
function blip(freq, dur, type, vol){
  if(!AC || !SAVE.settings.sound || document.hidden || state === 'paused') return;
  try{
    if(AC.state === 'suspended') AC.resume().catch(()=>{});
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.15));
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || 0.15));
  }catch(e){}
}

function pickType(rnd){

  for(const t of TYPES){ r -= t.w; if(r <= 0) return t; }
  return TYPES[0];
}

function dailyProgress(day=courseId()){
  if(SAVE.daily.day !== day) SAVE.daily = {day, counts:{}, claimed:{}};
  return SAVE.daily;
}
function dailyMissions(day=courseId()){
  const start = hashStr(day)%MISSIONS.length;
  return [0,2,4].map(n => MISSIONS[(start+n)%MISSIONS.length]);
}
function progressEvent(id, amount=1){
  if(G.mode === 'tutorial') return;
  SAVE.stats[id] = (SAVE.stats[id] || 0) + amount;
  const d = dailyProgress(G.course);
  d.counts[id] = (d.counts[id] || 0) + amount;
  for(const m of dailyMissions(G.course)){
    if((d.counts[m.id]||0) >= m.target && !d.claimed[m.id]){
      d.claimed[m.id] = true; SAVE.bank += m.reward; G.rewardGold += m.reward;
      G.banner = {life:3, name:'Mission complete', sub:m.title+' · +'+m.reward+' gold', color:'#ffd98a'};
    }
  }
  if(dailyMissions(G.course).every(m=>d.claimed[m.id])) SAVE.badges['daily-'+G.course] = true;
  for(const [key, threshold, badge] of [['landings',10,'ace'],['deliveries',5,'courier'],['rings',30,'acrobat'],['islands',20,'explorer'],['high',1,'astronaut']]){
    if((SAVE.stats[key]||0) >= threshold) SAVE.badges[badge] = true;
  }
  persist();
}
function missionHTML(){
  const d=dailyProgress();
  return dailyMissions().map(m=>{
    const count=Math.min(m.target,d.counts[m.id]||0), done=!!d.claimed[m.id];
    return '<div class="mission"><span>'+(done?'✓ Earned':m.reward+' gold')+'</span><b>'+m.title+'</b><div>'+count+' / '+m.target+'</div><progress max="'+m.target+'" value="'+count+'" aria-label="'+m.title+'"></progress></div>';
  }).join('');
}
function discoverIsland(is){
  if(is.found) return;
  is.found=true; G.found++; G.gold+=100;
  if(G.mode === 'tutorial') return;
  SAVE.discoveries[is.name]={theme:TM.id, day:G.course, landmark:is.landmark};
  if(is.landmark) SAVE.landmarks[is.landmark]=true;
  // Keep the latest 100 named places; landmark and achievement collections never expire.
  const names=Object.keys(SAVE.discoveries);
  if(names.length>100) delete SAVE.discoveries[names[0]];
  progressEvent('islands');
}
function trick(label, base){
  G.combo = G.comboT > 0 ? Math.min(5,G.combo+1) : 1; G.comboT=6;
  const reward=base*G.combo; G.gold+=reward;
  G.banner={life:1.5,name:label+(G.combo>1?' ×'+G.combo:''),sub:'+'+reward+' gold · chain another within 6s',color:'#a5f5de'};
}
function assignDeliveryTarget(){
  if(!G.parcel || G.parcel.toX != null) return;
  const next = G.islands.find(is=>is.x>G.parcel.fromX && is.strip);
  if(next){ G.parcel.toX=next.x; G.parcel.to=next.name; }
}
function handleDelivery(is){
  if(G.mode === 'tutorial') return;
  assignDeliveryTarget();
  if(G.parcel && G.parcel.toX === is.x){
    G.gold+=300; G.deliveries++; progressEvent('deliveries');
    G.banner={life:3,name:'Parcel delivered!',sub:is.name+' · +300 gold',color:'#ffd98a'};
    G.parcel=null;
  }
  if(!G.parcel){
    G.parcel={from:is.name,fromX:is.x,toX:null,to:''}; assignDeliveryTarget();
    if(G.deliveries===0) G.banner={life:3,name:'Parcel aboard',sub:'Deliver to '+(G.parcel.to||'the next runway'),color:'#ffd98a'};
  }
}
function updateActivities(dt){
  const wx=G.scroll+jetX;
  if(G.mode==='tutorial'){
    if(G.tutorialStep===0 && input.up){
      G.tutorialClimb+=dt/60;
      if(G.tutorialClimb>.65){G.tutorialStep=1; G.pickups=[];}
    }
    if(G.tutorialStep===1 && !G.pickups.some(p=>!p.got && p.x>wx-35)){
      G.pickups=[{x:wx+260,y:clamp(G.jetY,80,seaY-90),type:TYPES[0],phase:0,got:false}];
    }
    if(G.tutorialStep===2 && !G.islands.some(is=>is.strip && is.x+is.w>wx+40)){
      const is=makeIsland(wx+320,12345); is.heights.fill(56); is.strip={i0:3,i1:is.tiles-4,h:56}; is.feats=[]; is.rocks.fill(false); is.pads=[];
      G.islands=[is]; G.nextIsland=is.x+is.w+1200;
    }
  }
  for(const is of G.islands){
    for(const ring of is.rings){
      if(ring.got||ring.missed) continue;
      if(Math.abs(ring.x-wx)<24 && Math.abs(ring.y-G.jetY)<30){
        ring.got=true; G.rings++; trick('Clean ring',25); progressEvent('rings');
        blip(750+G.combo*90,.08,'sine',.045); haptic('LIGHT');
      } else if(ring.x<wx-26){ring.missed=true; G.combo=0;}
    }
    const gap=terrainTopAt(wx)-G.jetY;
    if(!is.lowPass && wx>is.x && wx<is.x+is.w && gap>22 && gap<52 && G.speed>5 && G.invuln<=0){
      is.lowPass=true; trick('Low pass',40); progressEvent('lowpasses');
    }
  }
  assignDeliveryTarget();
  if(G.parcel && G.parcel.toX!=null){
    const target=G.islands.find(is=>is.x===G.parcel.toX);
    if((target && wx>target.x+target.w+100)||(!target && wx>G.parcel.toX+800)){
      G.banner={life:2.5,name:'Missed the delivery',sub:'Pick up a new parcel at the next runway',color:'#ffba9b'}; G.parcel=null;
    }
  }
}

async function api(path, body){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 6000);
  try{
    const r = await fetch(API + path, {
      method: body ? 'POST' : 'GET',
      headers: body ? { 'Content-Type':'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
      signal: ctl.signal
    });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return await r.json();
  } finally { clearTimeout(t); }
}

const TILE = 14;
function makeIsland(x, seed){
  const r = mulberry32(seed);
  const tiles = 16 + Math.floor(r()*20);
  const peak = H * (0.10 + r()*0.16);
  const heights = [], feats = [];
  for(let i=0;i<tiles;i++){
    const edge = Math.min(i, tiles-1-i);
    const rise = clamp(edge/2.2, 0, 1);
    const wob = 0.78 + 0.22*Math.sin(i*0.7 + seed);
    let h = peak * rise * wob;
    h = Math.max(TILE, Math.round(h/TILE)*TILE);
    heights.push(h);
  }
  // A guaranteed six-tile airstrip gives every island a delivery stop.
  const mid = Math.floor(tiles/2), stripH = heights[mid];
  for(let k=mid-3;k<=mid+3;k++) heights[k] = stripH;
  // flat landing strip: the longest run of level ground
  let strip = null, bi = -1, bl = 0, ci = 1, cl = 1;
  for(let k=2;k<tiles-1;k++){
    if(heights[k] === heights[k-1] && heights[k] > TILE){ cl++; }
    else { if(cl > bl){ bl = cl; bi = ci; } ci = k; cl = 1; }
  }
  if(cl > bl){ bl = cl; bi = ci; }
  if(bl >= 5) strip = { i0:bi, i1:bi+bl-1, h:heights[bi] };
  const onStrip = k => strip && k >= strip.i0-1 && k <= strip.i1+1;

  // bouncy jump pads, on flat ground away from the runway
  const pads = [];
  if(r() < 0.75){
    for(let tries=0;tries<8 && pads.length < 2;tries++){
      const idx = 2 + Math.floor(r()*(tiles-4));
      if(onStrip(idx) || pads.indexOf(idx) >= 0) continue;
      if(heights[idx] < TILE*1.5 || heights[idx] !== heights[idx+1]) continue;
      pads.push(idx);
    }
  }
  const isPad = k => pads.indexOf(k) >= 0;

  // rock spires — fly over them or between them
  const rocks = new Array(tiles).fill(false);
  const spires = r() < 0.6 ? 1 + (r() < 0.4 ? 1 : 0) : 0;
  for(let s2=0;s2<spires;s2++){
    const idx = 2 + Math.floor(r()*(tiles-4));
    if(onStrip(idx) || isPad(idx) || isPad(idx-1) || heights[idx] < TILE*1.5 || rocks[idx]) continue;
    heights[idx] += TILE*(3 + Math.floor(r()*5));
    rocks[idx] = true;
  }

  // surface features
  let i = 1;
  while(i < tiles-1){
    if(onStrip(i) || rocks[i] || isPad(i) || isPad(i-1)){ i += 1; continue; }
    const h = heights[i], roll = r();
    if(h > TILE*3.2 && roll < 0.22){ feats.push({k:'mount', i, s:1+r()*0.6}); i += 2; }
    else if(h > TILE*1.6 && roll < 0.5){ feats.push({k:'tree', i, s:0.8+r()*0.5}); i += 1; }
    else if(h > TILE*2.2 && roll < 0.62){ feats.push({k:'field', i, w:2+Math.floor(r()*2)}); i += 3; }
    else if(h > TILE*2 && roll < 0.72){ feats.push({k:'hut', i}); i += 2; }
    else i += 1;
  }
  const pierSide = r() < 0.6 ? (r()<0.5?-1:1) : 0;
  const name = ISLE_A[Math.floor(r()*ISLE_A.length)] + ' ' + ISLE_B[Math.floor(r()*ISLE_B.length)];
  const decor = mulberry32(seed ^ 0x516b32);
  const landmark = decor() < .48 ? LANDMARKS[Math.floor(decor()*LANDMARKS.length)].id : null;
  const waterfall = decor() < .35;
  const rings = Array.from({length:3}, (_,j) => ({x:x+60+j*90, y:seaY-peak-95-j*18, got:false, missed:false}));
  return { x, w:tiles*TILE, tiles, heights, feats, rocks, strip, pads, padT:{}, pierSide, name, found:false, landed:false, seed, landmark, waterfall, rings, lowPass:false };
}

function padAt(wx){
  for(const is of G.islands){
    if(wx < is.x - 6 || wx > is.x + is.w + 6) continue;
    const i = clamp(Math.floor((wx - is.x)/TILE), 0, is.tiles-1);
    for(const k of is.pads){
      if(i === k || i === k+1) return { is, k };
    }
  }
  return null;
}

function terrainTopAt(wx){
  for(let k=0;k<G.islands.length;k++){
    const is = G.islands[k];
    if(wx >= is.x && wx <= is.x + is.w){
      const i = clamp(Math.floor((wx - is.x)/TILE), 0, is.tiles-1);
      return seaY - is.heights[i];
    }
  }
  return seaY;
}

function ensureWorld(){
  while(G.nextIsland < G.scroll + W + 900){
    const is = makeIsland(G.nextIsland, (G.seed = (G.seed*1103515245 + 12345) & 0x7fffffff));
    G.islands.push(is);
    G.nextIsland += is.w + 420 + G.rngI()*760;
  }
  while(G.nextPickup < G.scroll + W + 900){
    const t = pickType(G.rngP);
    const top = terrainTopAt(G.nextPickup);
    let y;
    if(G.rngP() < 0.28){                 // a few treats in the thin air
      y = skyTop + 90 + G.rngP()*(H*0.9);
    } else {
      y = H*0.12 + G.rngP()*(seaY - H*0.12 - 150);
      y = Math.min(y, top - 70);
      y = clamp(y, H*0.08, seaY - 70);
    }
    G.pickups.push({ x:G.nextPickup, y, type:t, phase:G.rngP()*6.28, got:false });
    G.nextPickup += 230 + G.rngP()*430;
  }
  while(G.nextBounce < G.scroll + W + 900){
    G.clouds.push({
      x: G.nextBounce,
      y: skyTop + 150 + G.rngC()*(H*0.95),
      s: 1.35 + G.rngC()*0.45,
      squash: 0, phase: G.rngC()*6.28
    });
    G.nextBounce += 260 + G.rngC()*420;
  }
  G.clouds = G.clouds.filter(c => c.x > G.scroll - 400);
  G.islands = G.islands.filter(i => i.x + i.w > G.scroll - 300);
  G.pickups = G.pickups.filter(p => p.x > G.scroll - 200 && !p.got);
}

function reset(){
  G.t=0; G.scroll=0; G.speed=4; G.jetY=H*0.4; G.vy=0; G.tilt=0;
  G.health=3; G.gold=0; G.found=0; G.dist=0; G.landings=0;
  G.fuel=G.maxFuel; G.dry=false; G.ranDry=false; G.warnT=0; G.land=null;
  G.camY=0; G.clouds=[]; G.nextBounce=900; G.highBest=0;
  G.islands=[]; G.pickups=[]; G.puffs=[]; G.floats=[];
  G.fx={speed:0,lift:0,shield:0}; G.invuln=0; G.shake=0; G.banner=null;
  G.nextIsland=700; G.nextPickup=560;
  G.course = courseId();
  const cs = hashStr(G.course);
  G.seed = (cs & 0x7fffffff) || 1;
  G.rngI = mulberry32(cs ^ 0x1b873593); G.rngP = mulberry32(cs ^ 0x7f4a7c15); G.rngC = mulberry32(cs ^ 0x2545f491);
  G.runT = 0; G.recT = 0; G.rec = [0, Math.round(altOf(G.jetY)*1000)/1000]; G.ghosts = [];
  G.mode = flightMode; G.assisted = flightMode === 'tutorial' || (flightMode === 'free' && SAVE.god);
  G.combo = 0; G.comboT = 0; G.rings = 0; G.deliveries = 0; G.parcel = null; G.rewardGold = 0;
  G.tutorialStep = 0; G.tutorialClimb = 0; G.exhaust = 0; G.reason = ''; G.ended = false;
  G.ghostStatus = ''; G.rivalGap = null;
  if(G.mode === 'daily' || G.mode === 'tutorial') PL = PLANES[0]; else applyEquip();
  if(G.mode === 'daily') TM = THEMES[hashStr(G.course) % THEMES.length];
  ensureWorld();
}

// ---------- update ----------
function addFloat(text, color){
  G.floats.push({ text, color, x:jetX, y:G.jetY-60, life:1.3 });
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = 1+Math.random()*4;
    G.puffs.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, life:0.6+Math.random()*0.5, color, r:3+Math.random()*4});
  }
}

function hit(){
  if(G.invuln > 0) return;
  if(G.assisted){
    G.vy = -8; G.invuln = 0.6; G.shake = 6;
    G.fuel = Math.max(G.fuel, 25);
    burst(jetX, G.jetY+18, '#ffe9a0', 12); blip(620,0.1,'triangle',0.04); haptic('LIGHT');
    return;
  }
  if(G.fx.shield > 0){
    G.vy = -7; G.invuln = 0.5; G.shake = 8;
    burst(jetX, G.jetY+18, '#bfe9ff', 14); blip(520,0.12,'triangle',0.05); haptic('LIGHT');
    return;
  }
  G.combo = 0; G.comboT = 0;
  G.health--; G.invuln = 1.4; G.shake = 16; G.vy = -7.5;
  G.fx.speed = 0;
  G.ranDry = G.fuel <= 0;
  if(G.fuel < 20){ G.fuel = 20; G.dry = false; }
  burst(jetX, G.jetY+18, '#ffd08a', 20);
  blip(150,0.25,'sawtooth',0.06); haptic('MEDIUM');
  if(G.health <= 0){ gameOver(); }
}

function collect(p){
  p.got = true;
  const t = p.type;
  if(t.id==='speed') G.fx.speed = 7;
  if(t.id==='lift') G.fx.lift = 9;
  if(t.id==='shield') G.fx.shield = 9;
  if(t.id==='repair') G.health = Math.min(G.maxHealth, G.health+1);
  if(t.id==='gold') G.gold += 250;
  if(t.id==='fuel'){
    G.fuel = Math.min(G.maxFuel, G.fuel + 50); G.dry = false; progressEvent('fuel');
    if(G.mode === 'tutorial' && G.tutorialStep === 1) G.tutorialStep = 2;
  }
  G.gold += 50;
  G.banner = { life:1.5, name:t.name, sub:t.sub, color:t.color };
  burst(p.x - G.scroll, p.y, t.color, 16);
  blip(880,0.09,'square',0.05); setTimeout(()=>blip(1320,0.12,'square',0.045), 70);
}

function commonTick(dt){
  const sec = dt/60;
  G.exhaust=lerp(G.exhaust,G.fuel<=0||state==='landed'?0:G.fx.speed>0||input.right?52:24,.12*dt);
  G.runT += sec; G.recT += sec;
  if(G.recT >= 0.1 - 1e-9){
    G.recT -= 0.1;
    if(G.rec.length < 12000) G.rec.push(Math.round(G.scroll), Math.round(altOf(G.jetY)*1000)/1000);
  }
  if(G.comboT > 0) G.comboT -= sec; else G.combo = 0;
  if(G.mode === 'daily' && G.runT >= DAILY_SECONDS && !G.ended){ G.reason = 'Race complete'; gameOver(); }
  const camTarget = clamp(G.jetY - H*0.52, skyTop, 0);
  G.camY = lerp(G.camY, camTarget, 0.09*dt);
  for(const c of G.clouds) if(c.squash > 0) c.squash = Math.max(0, c.squash - 3.2*sec);
  for(const is of G.islands){
    for(const k in is.padT) if(is.padT[k] > 0) is.padT[k] = Math.max(0, is.padT[k] - 3.4*sec);
  }
  for(const k in G.fx) if(G.fx[k] > 0) G.fx[k] = Math.max(0, G.fx[k] - sec);
  if(G.invuln > 0) G.invuln -= sec;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*0.8);
  if(G.banner){ G.banner.life -= sec; if(G.banner.life <= 0) G.banner = null; }
  for(const q of G.puffs){ q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 0.12*dt; q.life -= sec; }
  G.puffs = G.puffs.filter(q => q.life > 0);
  for(const f of G.floats){ f.y -= 0.7*dt; f.life -= sec; }
  G.floats = G.floats.filter(f => f.life > 0);
}

// the flat strip the jet is currently above, if any
function stripUnder(){
  const wx = G.scroll + jetX;
  for(const is of G.islands){
    if(!is.strip) continue;
    const x0 = is.x + is.strip.i0*TILE;
    const x1 = is.x + (is.strip.i1 + 1)*TILE;
    if(wx > x0 - 420 && wx < x1 - 24) return { is, x0, x1, top: seaY - is.strip.h };
  }
  return null;
}

function beginLanding(){
  const z = stripUnder();
  if(!z) return;
  z.targetX = clamp(z.x0 + (z.x1 - z.x0)*0.55, z.x0 + 30, z.x1 - 28);
  G.land = z; state = 'landing';
  clearInput();
  blip(330,0.12,'triangle',0.04);
}

function touchdown(){
  state = 'landed';
  G.fuel = G.maxFuel; G.dry = false; G.vy = 0; G.tilt = 0;
  G.landings++;
  if(G.land && !G.land.is.landed){
    G.land.is.landed = true; G.gold += 150; progressEvent('landings');
    discoverIsland(G.land.is);
    handleDelivery(G.land.is);
  }
  if(G.mode === 'tutorial') { G.tutorialStep = 3; SAVE.tutorial = true; persist(); }
  if(!G.banner || !G.parcel) G.banner = { life:1.6, name:'Refuelled', sub:'Tanks full · ready to fly', color:'#ffb648' };
  burst(jetX, G.jetY + 16, '#e8e2cf', 14);
  blip(620,0.12,'triangle',0.05); setTimeout(()=>blip(880,0.14,'triangle',0.045), 110); haptic('LIGHT');
}

function takeOff(){
  state = 'play'; G.speed = 6; G.vy = -8.5; G.invuln = 1.1; G.land = null;
  blip(440,0.1,'square',0.045);
}

function updateLanding(dt){
  G.t += dt;
  const z = G.land;
  const left = z.targetX - (G.scroll + jetX);
  // glide in: hold enough speed to reach the runway, then settle on the spot
  const want = clamp(left*0.045, 0, 9);
  G.speed = left > 2 ? Math.max(0.9, Math.min(G.speed, Math.max(want, 1.6))) : Math.max(0, G.speed - 0.35*dt);
  G.scroll += G.speed*dt;
  if(left <= 2 && G.speed < 0.5){ G.scroll = z.targetX - jetX; G.speed = 0; }
  const ty = z.top - 15;
  const rate = left > 120 ? 0.035 : 0.075;
  G.jetY = lerp(G.jetY, ty, rate*dt);
  G.vy = 0;
  G.tilt = lerp(G.tilt, 0, 0.12*dt);
  G.fuel = Math.max(0, G.fuel - 0.8*(dt/60));
  if(G.speed <= 0.06 && left <= 3 && Math.abs(G.jetY - ty) < 2.5) touchdown();
  commonTick(dt);
}

function update(dt){
  G.t += dt;
  const sec = dt/60;

  // petrol
  const burnBase = (input.right ? 3.4 : input.left ? 1.4 : 2.1) * PL.burn;
  G.fuel = Math.max(0, G.fuel - burnBase*(G.fx.speed > 0 ? 1.6 : 1)*sec);
  const dry = G.fuel <= 0;
  if(dry && !G.dry){
    G.dry = true; G.fx.speed = 0;
    addFloat('Out of petrol — glide to a runway', '#ffb648');
    blip(180,0.4,'sawtooth',0.05);
  }
  if(!dry) G.dry = false;
  if(G.fuel < 25 && !dry){
    G.warnT -= sec;
    if(G.warnT <= 0){ G.warnT = 1.1; blip(760,0.07,'square',0.03); }
  }

  // horizontal
  const target = dry ? 2.6 : (input.right ? 9.2*PL.spd : input.left ? 2.2 : 4.8*PL.spd);
  G.speed = lerp(G.speed, target, 0.06*dt);
  const vx = G.speed * (G.fx.speed > 0 && !dry ? 1.9 : 1);
  G.scroll += vx * dt;
  G.dist += vx * dt;
  G.gold += vx * dt * 0.02;

  // vertical
  const thrust = (G.fx.lift > 0 ? 0.98 : 0.64) * PL.lift;
  const climbCap = G.fx.lift > 0 ? -11 : -9;
  if(input.up && !dry && G.vy > climbCap && G.jetY > skyTop - H*0.8) G.vy -= thrust * dt;
  G.vy += 0.30 * dt;
  G.vy = clamp(G.vy, -22, 9.5);          // bounces can beat the engine
  G.jetY += G.vy * dt;
  // no hard ceiling: the jet can climb out of the top of the screen. The engine
  // only gives up well above it, so gravity always brings the jet back into view.
  if(G.jetY < skyTop - H*0.8 && G.vy < 0){ G.vy = Math.min(G.vy + 0.6*dt, 0); }

  // altitude: 0 at the sea, 1 at the top of the sky
  const alt = clamp((seaY - G.jetY) / (seaY - skyTop), 0, 1);
  G.gold += vx * dt * 0.02 * 2.2 * alt;   // thin-air bonus on top of the usual trickle
  if(alt > 0.62 && G.highBest < 0.62){ addFloat('Stratosphere! Gold pays double up here', '#bfe9ff'); progressEvent('high'); }
  if(alt > G.highBest) G.highBest = alt;

  // bounce clouds
  if(G.vy > 0){
    for(const c of G.clouds){
      const surf = c.y - 34*c.s;
      if(Math.abs(c.x - (G.scroll + jetX)) < 76*c.s &&
         G.jetY + 14 > surf && G.jetY + 14 < surf + 30 + G.vy*2){
        const power = 12.5 + 8*alt;
        G.vy = -power; G.jetY = surf - 16; c.squash = 1;
        G.gold += 15; trick('Cloud bounce', 15); progressEvent('bounces');
        burst(jetX, G.jetY + 26, '#ffffff', 8);
        blip(520 + 420*alt, 0.1, 'sine', 0.045); haptic('LIGHT');
        break;
      }
    }
  }
  G.tilt = lerp(G.tilt, clamp(G.vy*0.05, -0.42, 0.5), 0.2*dt);

  commonTick(dt);
  if(G.ended) return;
  ensureWorld();
  updateActivities(dt);

  // pickups
  const wx = G.scroll + jetX;
  for(const p of G.pickups){
    if(p.got) continue;
    const py = p.y + Math.sin(G.t*0.05 + p.phase)*6;
    if(Math.abs(p.x - wx) < 42 && Math.abs(py - G.jetY) < 40) collect(p);
  }

  // discovery
  for(const is of G.islands){
    if(!is.found && wx > is.x + is.w*0.5){
      discoverIsland(is);
      addFloat(is.name + ' found!', '#ffe9a8');
      blip(660,0.1,'triangle',0.04);
    }
  }

  // collisions
  const top = terrainTopAt(wx);
  if(G.jetY + 15 > seaY){
    G.jetY = seaY - 15;
    burst(jetX, seaY, '#cfeaff', 18);
    hit();
  } else if(G.jetY + 14 > top){
    const pad = padAt(wx);
    if(pad && G.vy > -1){
      pad.is.padT[pad.k] = 1;
      G.jetY = top - 16; G.vy = -18.5; G.gold += 25;
      burst(jetX, top, '#ffd54a', 14);
      blip(300,0.07,'square',0.05); setTimeout(()=>blip(900,0.14,'square',0.05), 60); haptic('LIGHT');
    } else {
      G.jetY = top - 14;
      hit();
    }
  }

}

// ---------- drawing ----------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function darken(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*(1-f)), g = Math.round(((n>>8)&255)*(1-f)), b = Math.round((n&255)*(1-f));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function drawSky(){
  const g = ctx.createLinearGradient(0, skyTop, 0, seaY);
  g.addColorStop(0, darken(TM.sky[0], 0.74));
  g.addColorStop(0.40, darken(TM.sky[0], 0.34));
  g.addColorStop(0.62, TM.sky[0]);
  g.addColorStop(0.82, TM.sky[1]);
  g.addColorStop(0.94, TM.sky[2]);
  g.addColorStop(1, TM.sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0, skyTop - 600, W, seaY - skyTop + 900);

  // stars, only worth seeing when you are up there
  const hi = clamp((-G.camY) / (-skyTop) * 1.5, 0, 1);
  if(hi > 0.05){
    ctx.globalAlpha = hi * 0.8;
    ctx.fillStyle = '#ffffff';
    const off = (G.scroll * 0.12) % (W + 200);
    for(let i=0;i<46;i++){
      const sd = i*97.13;
      let x = ((Math.sin(sd)*0.5+0.5)*(W+200)) - off; if(x < -20) x += W + 200;
      const y = skyTop + 40 + (Math.sin(sd*2.7)*0.5+0.5)*(H*0.95);
      const r = 0.8 + (Math.sin(sd*5.1)*0.5+0.5)*1.4;
      ctx.fillRect(x, y, r, r);
    }
    ctx.globalAlpha = 1;
  }
}

function cloudShape(){
  ctx.beginPath();
  ctx.ellipse(-52,-14,30,16,0,0,6.283);
  ctx.ellipse(-14,-26,38,26,0,0,6.283);
  ctx.ellipse(26,-18,30,20,0,0,6.283);
  ctx.ellipse(58,-11,22,13,0,0,6.283);
  ctx.rect(-80,-13,160,13);
  ctx.closePath();
}
function drawCloud(x,y,s,a){
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x,y); ctx.scale(s,s);
  const shade=ctx.createLinearGradient(0,-50,0,3);shade.addColorStop(0,TM.cloud);shade.addColorStop(1,'rgba(150,187,215,.72)');
  ctx.fillStyle=shade;cloudShape();ctx.fill();
  ctx.strokeStyle = TM.cloudLine; ctx.lineWidth = 3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,-6); ctx.quadraticCurveTo(8,4,24,-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30,-4); ctx.quadraticCurveTo(40,2,50,-4); ctx.stroke();
  ctx.restore();
}
const cloudLayers = [
  { p:0.10, n:3, s:1.1,  a:0.22, ys:[-1.00,-0.35] },  // wisps in the thin air
  { p:0.16, n:4, s:1.1, a:0.30, ys:[0.10,0.30] },
  { p:0.34, n:3, s:1.3, a:0.42, ys:[0.16,0.50] },
  { p:0.62, n:3, s:1.1, a:0.42, ys:[0.30,0.66] }
];
function drawClouds(front){
  const layers = front ? [{p:1.15,n:2,s:1.35,a:0.16,ys:[0.65,0.95]}] : cloudLayers;
  for(const L of layers){
    const span = W + 420;
    const off = (G.scroll * L.p) % span;
    for(let i=0;i<L.n;i++){
      const seed = i*137.5 + L.p*991;
      const base = (i/L.n)*span + (Math.sin(seed)*0.5+0.5)*160;
      let x = base - off; if(x < -220) x += span;
      const t = (Math.sin(seed*2.3)*0.5+0.5);
      const y = H*lerp(L.ys[0], L.ys[1], t);
      const distance=Math.hypot((x-jetX)*.7,y-G.jetY);
      const fade=front?clamp(distance/230,.08,1):1;
      drawCloud(x, y, L.s*(0.8+0.4*t), L.a*fade);
    }
  }
}

function drawBounceCloud(c){
  const x = c.x - G.scroll;
  if(x < -220 || x > W + 220) return;
  const q = SAVE.settings.reducedMotion ? 0 : c.squash;
  const bob = SAVE.settings.reducedMotion ? 0 : Math.sin(G.t*0.03 + c.phase)*4;
  ctx.save();
  ctx.translate(x, c.y + bob);
  ctx.scale(c.s * (1 + q*0.22), c.s * (1 - q*0.45));
  // glow
  ctx.shadowColor = 'rgba(150,230,255,.9)'; ctx.shadowBlur = 16 + q*22;
  ctx.fillStyle = '#ffffff'; cloudShape(); ctx.fill();
  ctx.shadowBlur = 0;
  // springy rim + sparkles
  ctx.strokeStyle = 'rgba(120,225,255,' + (0.55 + q*0.4) + ')'; ctx.lineWidth = 3;
  cloudShape(); ctx.stroke();
  ctx.fillStyle = 'rgba(120,225,255,.9)';
  for(let i=0;i<3;i++){
    const sx = -40 + i*40, sy = -34 - 6*Math.sin(G.t*0.06 + i + c.phase);
    ctx.beginPath(); ctx.moveTo(sx, sy-5); ctx.lineTo(sx+3, sy); ctx.lineTo(sx, sy+5); ctx.lineTo(sx-3, sy); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawSea(){
  const g = ctx.createLinearGradient(0,seaY,0,H);
  g.addColorStop(0,TM.sea[0]); g.addColorStop(1,TM.sea[1]);
  ctx.fillStyle = g; ctx.fillRect(0,seaY,W,H-seaY);
  ctx.fillStyle = TM.foam;
  ctx.fillRect(0,seaY,W,3);
  ctx.strokeStyle = TM.wave; ctx.lineWidth = 3; ctx.lineCap='round';
  const shimmer=SAVE.settings.reducedMotion?0:Math.sin(G.t*.025)*12;
  ctx.fillStyle='rgba(255,236,179,.10)';
  for(let j=0;j<5;j++)ctx.fillRect(W*.65-30-j*8+shimmer,seaY+10+j*12,60+j*16,3);
  const off = G.scroll % 120;
  for(let row=0; row<3; row++){
    const yy = seaY + 22 + row*30;
    if(yy > H) break;
    for(let x=-120; x<W+120; x+=120){
      const px = x - off*(1 - row*0.18) + (row%2)*60;
      ctx.beginPath(); ctx.moveTo(px,yy); ctx.lineTo(px+12,yy-7); ctx.lineTo(px+24,yy); ctx.stroke();
    }
  }
}

function drawIslandBase(is,c,th){
  const sx=60,baseY=300;

  if(is.pierSide !== 0){
    const px = is.pierSide < 0 ? sx - 46 : sx + is.w + 6;
    c.fillStyle = th.pier;
    c.fillRect(px, baseY - 6, 42, 7);
    c.fillStyle = th.pier2;
    for(let i=0;i<4;i++) c.fillRect(px + 4 + i*11, baseY + 1, 4, 14);
  }
  for(let i=0;i<is.tiles;i++){
    const h = is.heights[i], x = sx + i*TILE, top = baseY - h;
    if(is.rocks && is.rocks[i]){
      // rock spire — solid obstacle
      c.fillStyle = th.rock; c.fillRect(x, top, TILE+0.5, h + 8);
      c.fillStyle = th.rockTop; c.fillRect(x, top, TILE+0.5, 7);
      c.fillStyle = th.rockShade; c.fillRect(x + TILE - 5, top + 7, 5, h - 7);

    }

    c.fillStyle = th.grass; c.fillRect(x, top, TILE+0.5, h + 8);

    // grass cap + cliff shading
    c.fillStyle = th.grassTop; c.fillRect(x, top, TILE+0.5, 5);

    c.fillStyle = th.run; c.fillRect(rx, ry - 1, rw, 9);

    } else if(f.k === 'mount'){

      c.fillStyle = th.mount2;
      c.beginPath(); c.moveTo(x+wdt/2, gy-hgt); c.lineTo(x+wdt*1.05, gy); c.lineTo(x+wdt*0.55, gy); c.closePath(); c.fill();
      c.fillStyle = th.cap;
      c.beginPath(); c.moveTo(x+wdt/2, gy-hgt); c.lineTo(x+wdt*0.32, gy-hgt*0.68); c.lineTo(x+wdt*0.7, gy-hgt*0.68); c.closePath(); c.fill();
    } else if(f.k === 'field'){
      const w = f.w*TILE;
      c.fillStyle = th.field; c.fillRect(x, gy-9, w, 9);
      c.fillStyle = th.field2;
      for(let k=0;k<w;k+=6) c.fillRect(x+k, gy-9, 2, 9);

    c.fillStyle='rgba(255,255,255,.12)';

    if(th.id==='sunset'){
      c.strokeStyle=th.trunk;c.lineWidth=4;c.beginPath();c.moveTo(x+7,y);c.quadraticCurveTo(x+12,y-18,x+4,y-38);c.stroke();

      for(let j=-2;j<=2;j++){c.beginPath();c.moveTo(x+4,y-38);c.quadraticCurveTo(x+j*11,y-49,x+j*14,y-28);c.stroke();}

    }else if(th.id==='neon'){
      c.strokeStyle='#5064a7';c.lineWidth=3;c.beginPath();c.moveTo(x+7,y);c.lineTo(x+7,y-33);c.stroke();c.fillStyle='#8dffec';c.beginPath();c.arc(x+7,y-35,5,0,Math.PI*2);c.fill();
    }
  }
  if(th.id==='sunset'||th.id==='frost'){
    for(let j=0;j<5;j++){const x=sx+18+j*is.w/5;
      c.strokeStyle=th.id==='frost'?'#e3f9ff':'#f9a7a5';c.lineWidth=4;c.beginPath();c.moveTo(x,baseY+10);c.lineTo(x-3,baseY-1);c.lineTo(x+5,baseY-7);c.stroke();}
  }
  if(th.id==='neon') for(const f of is.feats.filter(f=>f.k==='hut')){
    const x=sx+f.i*TILE,y=baseY-is.heights[f.i];c.fillStyle='#ffd99d';c.fillRect(x+2,y-11,4,5);c.fillRect(x+12,y-11,4,5);
  }

      c.fillStyle='#eaf4ee';c.fillRect(-4,-49,16,49);c.fillStyle='#d36b50';c.fillRect(-4,-36,16,9);c.fillRect(-4,-17,16,8);c.fillStyle='#f9df83';c.fillRect(-6,-57,20,9);c.fillStyle='#273d56';c.fillRect(-8,-61,24,4);
    }else if(is.landmark==='windmill'){
      c.fillStyle='#d9cbae';c.beginPath();c.moveTo(-8,0);c.lineTo(-3,-40);c.lineTo(13,-40);c.lineTo(19,0);c.fill();c.fillStyle='#994e3a';c.beginPath();c.moveTo(-7,-40);c.lineTo(5,-52);c.lineTo(17,-40);c.fill();
    }else if(is.landmark==='ruins'){
      c.strokeStyle='#b9c9be';c.lineWidth=9;c.beginPath();c.moveTo(-10,0);c.lineTo(-10,-25);c.quadraticCurveTo(6,-50,23,-25);c.lineTo(23,0);c.stroke();c.strokeStyle='#5d887b';c.lineWidth=3;c.beginPath();c.moveTo(-10,-8);c.lineTo(-10,-22);c.stroke();
    }else if(is.landmark==='observatory'){
      c.fillStyle='#d3dae3';c.fillRect(-15,-20,36,20);c.fillStyle='#7ab7d4';c.beginPath();c.arc(3,-20,18,Math.PI,Math.PI*2);c.fill();c.strokeStyle='#e4f4ff';c.lineWidth=6;c.beginPath();c.moveTo(3,-26);c.lineTo(20,-42);c.stroke();
    }else{
      c.fillStyle='#263b69';c.fillRect(-8,-8,23,8);c.fillStyle='#9af4e2';c.beginPath();c.moveTo(3,-48);c.lineTo(13,-26);c.lineTo(3,-9);c.lineTo(-7,-26);c.closePath();c.fill();c.strokeStyle='#e1fffb';c.lineWidth=2;c.stroke();
    }
    c.restore();
  }
  // foam at the waterline
  c.fillStyle = th.foam;
  c.fillRect(sx-6, baseY+4, is.w+12, 4);
}

function drawIsland(is){
  const sx=is.x-G.scroll;
  if(sx>W+80||sx+is.w<-80) return;
  const key=TM.id+':'+is.seed+':'+is.heights.join(',');
  let tile=sceneryCache.get(key);
  if(!tile){
    tile=document.createElement('canvas'); const scale=Math.min(2,DPR*ZOOM);
    tile.width=Math.ceil((is.w+120)*scale);tile.height=Math.ceil(350*scale);
    const c=tile.getContext('2d');c.scale(scale,scale);drawIslandBase(is,c,TM);
    sceneryCache.set(key,tile);if(sceneryCache.size>48)sceneryCache.delete(sceneryCache.keys().next().value);
  }
  ctx.drawImage(tile,sx-60,seaY-300,is.w+120,350);
  // A small reflection anchors each island in the water.
  ctx.save();ctx.beginPath();ctx.rect(sx-60,seaY+12,is.w+120,55);ctx.clip();ctx.globalAlpha=.13;
  ctx.translate(sx-60,seaY+67);ctx.scale(1,-.18);ctx.drawImage(tile,0,0,is.w+120,350);ctx.restore();
  // jump pads
  for(const k of is.pads){
    const px = sx + k*TILE, py = seaY - is.heights[k];
    const q = is.padT[k] || 0;
    const h = 12 - q*7;
    ctx.fillStyle = '#5a5f6b'; ctx.fillRect(px - 2, py - 3, TILE*2 + 4, 4);
    ctx.strokeStyle = '#b9c2cf'; ctx.lineWidth = 3;
    for(let z=0;z<3;z++){
      const zy = py - 4 - (z+1)*(h/3.4);
      ctx.beginPath(); ctx.moveTo(px + 2, zy + 3); ctx.lineTo(px + TILE*2 - 2, zy); ctx.stroke();
    }
    const ty = py - 5 - h;
    ctx.fillStyle = '#d8323c'; ctx.fillRect(px - 5, ty, TILE*2 + 10, 7);
    ctx.fillStyle = '#ffffff';
    for(let z=0;z<3;z++) ctx.fillRect(px - 2 + z*11, ty + 2, 6, 3);
    ctx.fillStyle = 'rgba(255,214,90,' + (0.25 + q*0.6) + ')';
    ctx.beginPath(); ctx.moveTo(px + TILE, ty - 8 - q*10); ctx.lineTo(px + TILE + 7, ty - 2); ctx.lineTo(px + TILE - 7, ty - 2); ctx.closePath(); ctx.fill();
  }

  if(is.landmark==='windmill'){
    ctx.save();ctx.translate(sx+2*TILE+5,seaY-is.heights[2]-34);ctx.rotate(SAVE.settings.reducedMotion?.3:G.t*.012);
    for(let j=0;j<4;j++){ctx.rotate(Math.PI/2);ctx.fillStyle='#ecdfbb';ctx.fillRect(1,-3,24,5);ctx.fillStyle='#bd8e69';ctx.fillRect(6,-3,2,5);}ctx.restore();
  }
  if(is.waterfall&&!SAVE.settings.reducedMotion){
    const x=sx+TILE,top=seaY-is.heights[1]+8;ctx.fillStyle=TM.id==='volcano'?'#fff0bc':'#e7fcff';
    for(let y=top+(G.t*.7)%17;y<seaY+7;y+=17)ctx.fillRect(x+2,y,4,3);
  }
  if(G.parcel&&G.parcel.toX===is.x){outlineText('DELIVER HERE',sx+is.w/2,seaY-is.strip.h-45,15,'#ffd98a','center');}
  for(const r of is.rings){
    if(r.got||r.missed)continue;
    const x=r.x-G.scroll;ctx.save();ctx.strokeStyle='#ffe7a1';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,r.y,12,32,0,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#bf8439';ctx.lineWidth=2;ctx.stroke();ctx.restore();
  }
}

// --- glyph icons in the style of the skill sheet ---
function glyph(id){
  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if(id === 'speed'){
    for(let i=0;i<6;i++){
      const a = i*Math.PI/3 + 0.2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*5, Math.sin(a)*5);
      ctx.lineTo(Math.cos(a)*17, Math.sin(a)*17); ctx.stroke();
      const b = a + 0.32;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*11, Math.sin(a)*11);
      ctx.lineTo(Math.cos(b)*18, Math.sin(b)*18); ctx.stroke();
    }
  } else if(id === 'lift'){
    for(let i=0;i<3;i++){
      const y = 10 - i*10;
      ctx.beginPath(); ctx.moveTo(-13,y); ctx.lineTo(0,y-9); ctx.lineTo(13,y); ctx.stroke();
    }
  } else if(id === 'shield'){
    ctx.beginPath();
    ctx.moveTo(0,-17); ctx.quadraticCurveTo(14,-14,14,-4);
    ctx.quadraticCurveTo(14,10,0,18); ctx.quadraticCurveTo(-14,10,-14,-4);
    ctx.quadraticCurveTo(-14,-14,0,-17); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,-2); ctx.lineTo(0,5); ctx.lineTo(6,-2); ctx.stroke();
  } else if(id === 'fuel'){
    ctx.beginPath();
    ctx.moveTo(-11,-10); ctx.lineTo(7,-10); ctx.lineTo(7,15); ctx.lineTo(-11,15); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7,-10); ctx.lineTo(-7,-15); ctx.lineTo(1,-15); ctx.lineTo(1,-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7,-5); ctx.lineTo(15,-5); ctx.lineTo(15,8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,4); ctx.lineTo(2,4); ctx.stroke();
  } else if(id === 'repair'){
    ctx.beginPath();
    ctx.moveTo(-12,12); ctx.quadraticCurveTo(-14,-12,12,-14);
    ctx.quadraticCurveTo(14,12,-12,12); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,9); ctx.quadraticCurveTo(2,0,9,-10); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-14,10); ctx.lineTo(-10,-8); ctx.lineTo(0,2); ctx.lineTo(10,-8); ctx.lineTo(14,10);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-13,3.5,0,6.283); ctx.stroke();
  }
}
function drawPickup(p){
  const x = p.x - G.scroll, y = p.y + Math.sin(G.t*0.05 + p.phase)*6;
  if(x < -60 || x > W + 60) return;
  ctx.save(); ctx.translate(x,y);
  const halo = ctx.createRadialGradient(0,0,2,0,0,34);
  halo.addColorStop(0,'rgba(8,14,32,.5)'); halo.addColorStop(1,'rgba(8,14,32,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0,0,34,0,6.283); ctx.fill();
  ctx.rotate(Math.sin(G.t*0.02 + p.phase)*0.12);
  ctx.strokeStyle = p.type.color; ctx.shadowColor = p.type.glow; ctx.shadowBlur = 18;
  glyph(p.type.id);
  ctx.shadowBlur = 0; ctx.restore();
}

function drawFlameFace(s, c){
  const ctx = c || CTX;
  ctx.save(); ctx.scale(s,s);
  const g = ctx.createRadialGradient(-2,2,1,0,0,11);
  g.addColorStop(0,'#ffe259'); g.addColorStop(0.6,'#ff9d21'); g.addColorStop(1,'#e2431c');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(0,-13); ctx.quadraticCurveTo(7,-7,10,0);
  ctx.quadraticCurveTo(12,10,0,11); ctx.quadraticCurveTo(-12,10,-10,0);
  ctx.quadraticCurveTo(-8,-6,-3,-9); ctx.quadraticCurveTo(-2,-11,0,-13);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#2a1206';
  ctx.beginPath(); ctx.arc(-3.4,0.5,1.5,0,6.283); ctx.fill();
  ctx.beginPath(); ctx.arc(3.4,0.5,1.5,0,6.283); ctx.fill();
  ctx.strokeStyle = '#2a1206'; ctx.lineWidth = 1.4; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,3,2.6,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  ctx.restore();
}

function drawPlaneShape(c, P, pose={}){
  const K=P.col, bank=pose.bank||0, gear=pose.gear||0;
  const racer=P.id==='scarlet', explorer=P.id==='seahawk', glider=P.id==='nightowl', delta=P.id==='goldarrow';
  const N=racer?91:explorer?67:glider?73:delta?88:74;
  const span=(glider?57:explorer?47:delta?43:racer?29:35)*(1-Math.abs(bank)*.25);
  const poly=(pts,fill,stroke)=>{c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath();c.fillStyle=fill;c.fill();if(stroke){c.strokeStyle=stroke;c.lineWidth=1;c.stroke();}};
  // Wing geometry changes the silhouette, while a common light source unifies the fleet.
  poly([[4,-5],[-(racer?66:44),-span],[-(glider?12:24),-span],[delta?42:22,-4]],K.wing2,'rgba(255,255,255,.18)');
  poly([[-39,-8],[-30,P.shape.fin],[-17,P.shape.fin+2],[-6,-8]],K.fin);
  poly([[-33,-9],[-65,-24],[-51,-24],[-14,-7]],K.stab);
  if(explorer){
    for(const y of [-23,24]){c.fillStyle=K.body;c.beginPath();c.ellipse(-10,y,29,7,0,0,Math.PI*2);c.fill();c.fillStyle='#172a35';c.beginPath();c.ellipse(14,y,5,6,0,0,Math.PI*2);c.fill();}
  }
  const body=c.createLinearGradient(0,-17,0,18);body.addColorStop(0,K.wing);body.addColorStop(.32,K.body);body.addColorStop(1,darken(K.body,.45));
  c.fillStyle=body;c.beginPath();c.moveTo(-59,-8);c.lineTo(-16,-16);c.lineTo(30,-16);c.quadraticCurveTo(N-10,-12,N,0);c.quadraticCurveTo(N-15,14,30,16);c.lineTo(-24,13);c.lineTo(-59,7);c.closePath();c.fill();
  c.strokeStyle='rgba(255,255,255,.48)';c.lineWidth=1.2;c.beginPath();c.moveTo(-36,-11);c.lineTo(28,-13);c.quadraticCurveTo(N-14,-9,N-6,-2);c.stroke();
  c.strokeStyle='rgba(7,20,38,.36)';c.lineWidth=1;c.beginPath();c.moveTo(-22,-12);c.lineTo(-26,9);c.moveTo(6,-11);c.lineTo(2,12);c.moveTo(52,-8);c.lineTo(48,11);c.stroke();
  // Glass canopy with a broad reflection readable at phone scale.
  const glass=c.createLinearGradient(12,-19,45,-2);glass.addColorStop(0,'#f3fcff');glass.addColorStop(.3,K.canopy);glass.addColorStop(1,'#214664');
  c.fillStyle=glass;c.beginPath();c.moveTo(10,-15);c.quadraticCurveTo(35,-29,54,-7);c.lineTo(12,-4);c.closePath();c.fill();
  poly([[22,-18],[30,-18],[20,-6],[15,-6]],'rgba(255,255,255,.75)');
  const wingEnd=glider?-4:delta?4:-24;
  poly([[7,2],[-(racer?66:48),span],[wingEnd,span],[delta?46:31,6]],K.wing,'rgba(255,255,255,.32)');
  // Aileron and livery stripes.
  c.strokeStyle=K.body;c.lineWidth=2;c.beginPath();c.moveTo(-38,span-5);c.lineTo(wingEnd+2,span-5+(pose.flap||0)*3);c.stroke();
  c.strokeStyle='rgba(255,255,255,.72)';c.lineWidth=3;c.beginPath();c.moveTo(-21,span-10);c.lineTo(-7,span-20);c.stroke();
  if(delta) poly([[-12,12],[-26,31],[-13,31],[1,13]],'#fff3c4');
  c.fillStyle='#15273d';c.fillRect(-62,-7,9,14);c.fillStyle='#8dabb9';c.fillRect(-63,-5,3,10);
  c.save();c.translate(-24,P.shape.fin+13);drawFlameFace(.72,c);c.restore();
  if(gear>0){
    c.strokeStyle='#b7c6cc';c.lineWidth=3;
    for(const x of [-25,40]){c.beginPath();c.moveTo(x,10);c.lineTo(x,10+13*gear);c.stroke();c.fillStyle='#122036';c.beginPath();c.ellipse(x,10+13*gear,6,4,0,0,Math.PI*2);c.fill();}
  }
}

function drawGhosts(){
  G.rivalGap=null;
  if(!G.ghosts.length) return;
  const i = G.runT * 10;
  for(const g of G.ghosts){
    const tr = g.track, n = tr.length / 2;
    if(i >= n - 1){G.rivalGap=(g.you?'Your best':'Rival')+' finished'; continue;}                       // that pilot's run is over
    const k = Math.floor(i), f = i - k;
    const gx = tr[2*k] + (tr[2*k+2] - tr[2*k]) * f;
    const ga = tr[2*k+1] + (tr[2*k+3] - tr[2*k+1]) * f;
    const sx = jetX + (gx - G.scroll);
    const sy = seaY - ga * (seaY - skyTop);
    const label = g.you ? 'Your best' : g.name;
    G.rivalGap=label+' · '+(Math.abs(gx-G.scroll)/100).toFixed(1)+' km '+(gx>=G.scroll?'ahead':'behind');
    ctx.save();
    const vyOff = sy - G.camY;                     // where it sits on the visible screen
    if(sx < -80 || sx > W + 80 || vyOff < -30 || vyOff > H + 30){   // out of view: edge marker
      const ex = clamp(sx, 16, W - 16), ey = clamp(sy, G.camY + safeTop() + 40, G.camY + H - 40);
      const tag = sx < -80 ? '◀ ' + label : sx > W + 80 ? label + ' ▶' : vyOff < 0 ? '▲ ' + label : '▼ ' + label;
      ctx.globalAlpha = 0.75;
      outlineText(tag, ex, ey, 13, '#cfe9ff', sx < -80 ? 'left' : sx > W + 80 ? 'right' : 'center');
      ctx.restore(); continue;
    }
    const vy = (tr[2*k+1] - tr[2*k+3]) * (seaY - skyTop) / 6;
    ctx.globalAlpha = 0.8;
    outlineText(label, sx, sy - 46, 13, '#cfe9ff', 'center');
    ctx.translate(sx, sy); ctx.rotate(clamp(vy*0.05, -0.42, 0.5));
    ctx.globalAlpha = Math.hypot(sx-jetX,sy-G.jetY)<110?.10:.25;
    drawPlaneShape(ctx, PLANES.find(p=>p.id===g.plane)||PLANES[0]);
    ctx.restore();
  }
}
function drawJet(){
  const boosting = G.fuel > 0 && (G.fx.speed > 0 || input.right);
  const engineOff = G.fuel <= 0 || state === 'landed';
  ctx.save();
  ctx.translate(jetX, G.jetY);
  ctx.rotate(G.tilt);
  if(G.invuln > 0 && Math.floor(G.t/4) % 2 === 0) ctx.globalAlpha = 0.45;

  // exhaust
  const flick=SAVE.settings.reducedMotion?1:.94+.06*Math.sin(G.t*.8);
  const len=(engineOff?0:G.exhaust)*flick;
  if(len > 0){
    const eg = ctx.createLinearGradient(-58,0,-58-len,0);
    eg.addColorStop(0, boosting ? PL.col.hot : PL.col.warm);
    eg.addColorStop(1,'rgba(255,90,40,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.moveTo(-56,-7); ctx.lineTo(-56-len,0); ctx.lineTo(-56,7); ctx.closePath(); ctx.fill();
  }

  drawPlaneShape(ctx, PL, {bank:G.tilt,flap:input.up?-1:1,gear:state==='landed'||state==='landing'||(state==='paused'&&pausedFrom==='landed')?1:0});

  // shield bubble
  if(G.fx.shield > 0){
    ctx.strokeStyle = 'rgba(180,230,255,'+(0.55 + 0.25*Math.sin(G.t*0.15))+')';
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(4,0,74,0,6.283); ctx.stroke();
  }
  ctx.restore();
}

function coin(x,y,r){
  const g = ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.15,x,y,r);
  g.addColorStop(0,'#ffe9a0'); g.addColorStop(0.5,'#f5a623'); g.addColorStop(1,'#c25a12');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.ellipse(x-r*0.3,y-r*0.4,r*0.28,r*0.16,-0.6,0,6.283); ctx.fill();
}

function outlineText(text, x, y, size, fill, align){
  ctx.font = size + "px 'Luckiest Guy', Impact, 'Arial Black', sans-serif";
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size*0.22);
  ctx.strokeStyle = 'rgba(8,18,40,.85)'; ctx.strokeText(text,x,y);
  ctx.fillStyle = fill; ctx.fillText(text,x,y);
}

function drawOffscreenJet(){
  const sy = G.jetY - G.camY;
  if(sy > -6) return;
  const y = safeTop() + 14;
  ctx.save();
  ctx.fillStyle = 'rgba(8,18,40,.55)'; rr(jetX - 22, y - 12, 44, 24, 12); ctx.fill();
  ctx.fillStyle = '#ffe9a0';
  ctx.beginPath(); ctx.moveTo(jetX, y - 8); ctx.lineTo(jetX + 7, y + 4); ctx.lineTo(jetX - 7, y + 4); ctx.closePath(); ctx.fill();
  const m = Math.round(-sy / 10);
  outlineText(m + 'm', jetX + 26, y, 13, '#ffe9a0', 'left');

}
function drawHUD(){
  drawOffscreenJet();
  const pad = 16 + Math.max(safeInsets.left,safeInsets.right);
  const top = safeTop() + 34;
  // health flames
  for(let i=0;i<G.maxHealth;i++){
    const x = pad + 20 + i*34, y = top;
    ctx.save(); ctx.translate(x,y);
    if(i < G.health){ drawFlameFace(1.05); }
    else { ctx.globalAlpha = 0.25; ctx.fillStyle = '#0b1b38';
      ctx.beginPath(); ctx.arc(0,0,10,0,6.283); ctx.fill(); }
    ctx.restore();
  }
  // gold
  coin(W - pad - 22, top, 13);
  outlineText(String(Math.floor(G.gold)), W - pad - 44, top+1, 30, '#ffe9a0', 'right');
  // islands found + altitude
  outlineText('Islands ' + G.found, W - pad - 8, top + 34, 19, '#cfe9ff', 'right');
  const altM = Math.max(0, Math.round((seaY - G.jetY)/5));
  outlineText('Alt ' + altM + 'm', W - pad - 8, top + 60, 19, altM > 300 ? '#bfe9ff' : '#9fc4e6', 'right');
  // fuel gauge
  const fy = top + 32, fw = 152;
  ctx.fillStyle = 'rgba(8,18,40,.55)'; rr(pad, fy-11, fw, 22, 11); ctx.fill();
  const frac = clamp(G.fuel/G.maxFuel, 0, 1);
  const fcol = frac > 0.5 ? '#6ee86e' : frac > 0.22 ? '#ffd24a' : '#ff5f4d';
  if(!SAVE.settings.reducedMotion && frac <= 0.22 && Math.floor(G.t/10) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.fillStyle = fcol; rr(pad+3, fy-8, Math.max(0,(fw-6)*frac), 16, 8); ctx.fill();
  ctx.globalAlpha = 1;
  outlineText(G.fuel <= 0 ? 'NO PETROL' : 'PETROL', pad + 12, fy, 15, '#0b1b38');

  if(G.assisted){
    outlineText('INVINCIBLE', pad, fy + 26, 15, '#ffe9a0');
  }
  // active power-ups
  let by = fy + (G.assisted ? 52 : 30);
  const acts = [
    ['speed', G.fx.speed, 7, '#ff5f4d', 'Speed'],
    ['lift', G.fx.lift, 9, '#ffd76b', 'Wings'],
    ['shield', G.fx.shield, 9, '#bfe9ff', 'Shield']
  ];
  for(const [id, v, max, col, label] of acts){
    if(v <= 0) continue;
    ctx.fillStyle = 'rgba(8,18,40,.5)'; rr(pad, by-9, 122, 18, 9); ctx.fill();
    ctx.fillStyle = col; rr(pad+2, by-7, 118*(v/max), 14, 7); ctx.fill();
    outlineText(label, pad + 10, by, 14, '#0b1b38');
    by += 24;
  }
  if(G.mode==='daily') outlineText(Math.ceil(Math.max(0,DAILY_SECONDS-G.runT))+'s · Daily Race',W/2,top+36,16,'#ffe9a0','center');
  if(G.rivalGap||G.ghostStatus) outlineText(G.rivalGap||G.ghostStatus,W/2,H-56,13,'#cfe9ff','center');
  if(G.parcel) outlineText('Parcel → '+(G.parcel.to||'next runway'),W/2,H-34,15,'#ffd98a','center');
  if(G.combo>1&&G.comboT>0) outlineText('Combo ×'+G.combo,W-pad-8,top+86,16,'#a5f5de','right');
  // floating text
  for(const f of G.floats){
    ctx.globalAlpha = clamp(f.life,0,1);
    outlineText(f.text, W/2, f.y - G.camY, 24, f.color, 'center');
    ctx.globalAlpha = 1;
  }
}

function drawDistantIslands(){
  ctx.save();ctx.globalAlpha=.19;ctx.fillStyle=TM.mount;
  const span=600,off=(G.scroll*.12)%span;
  for(let x=-span;x<W+span;x+=span){
    const xx=x-off,yy=seaY-20;
    ctx.beginPath();ctx.moveTo(xx,yy);ctx.quadraticCurveTo(xx+75,yy-95,xx+130,yy-40);ctx.quadraticCurveTo(xx+180,yy-100,xx+290,yy);ctx.fill();
  }
  ctx.restore();
}
function drawBanner(){
  if(!G.banner||G.mode==='tutorial')return;
  const b=G.banner,width=Math.min(370,W-340),x=(W-width)/2,y=safeTop()+88;
  ctx.save();ctx.globalAlpha=Math.min(1,b.life/.25);ctx.fillStyle='rgba(9,28,48,.9)';rr(x,y,width,52,10);ctx.fill();
  ctx.fillStyle=b.color;ctx.fillRect(x+8,y+10,3,31);
  outlineText(b.name,W/2,y+18,17,b.color,'center');
  ctx.fillStyle='#eaf4ff';ctx.font='12px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(b.sub,W/2,y+39,width-32);
  ctx.restore();
}

function render(){
  ctx.save();
  if(G.shake > 0 && !SAVE.settings.reducedMotion){
    ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  }
  ctx.translate(0, -G.camY);
  drawSky();
  drawDistantIslands();
  drawClouds(false);
  drawSea();
  for(const is of G.islands) drawIsland(is);
  for(const c of G.clouds) drawBounceCloud(c);
  for(const p of G.pickups) drawPickup(p);
  drawGhosts();
  drawJet();
  for(const q of G.puffs){
    ctx.globalAlpha = clamp(q.life,0,1);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawClouds(true);
  ctx.restore();
  drawHUD();
  drawBanner();
}

// ---------- loop ----------
let last = performance.now(), accumulator = 0;
function frame(now){
  const elapsed=Math.min(.15,Math.max(0,(now-last)/1000)); last=now;
  if(state==='countdown'){
    const remaining=Math.ceil((resumeAt-now)/1000);
    document.getElementById('countdown').textContent=String(Math.max(1,remaining));
    if(now>=resumeAt&&!document.hidden){state=pausedFrom; document.getElementById('panel').classList.add('hide'); accumulator=0;}
  } else if(['play','landing','landed'].includes(state)&&!document.hidden){
    accumulator+=elapsed;
    while(accumulator+1e-9>=1/60){
      accumulator=Math.max(0,accumulator-1/60);
      if(state==='play') update(1);
      else if(state==='landing') updateLanding(1);
      else if(state==='landed'){G.t+=1; commonTick(1);}
      else {accumulator=0; break;}
    }
  } else { accumulator=0; }
  updateActionBtn(); updateTutorialHint(); render(); requestAnimationFrame(frame);
}
