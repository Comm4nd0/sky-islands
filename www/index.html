<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sky Islands — Power Up!</title>
<style>
  /* Bundled locally so the app never touches the network. */
  @font-face{
    font-family:'Luckiest Guy'; font-style:normal; font-weight:400; font-display:block;
    src:url(fonts/LuckiestGuy-latin.woff2) format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }
  @font-face{
    font-family:'Luckiest Guy'; font-style:normal; font-weight:400; font-display:block;
    src:url(fonts/LuckiestGuy-latin-ext.woff2) format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
  }
</style>
<style>
  :root{
    --st: env(safe-area-inset-top,0px);
    --sb: env(safe-area-inset-bottom,0px);
    --sl: env(safe-area-inset-left,0px);
    --sr: env(safe-area-inset-right,0px);
    --ink:#0d1b34;
    --paper:#eaf4ff;
    --panel:rgba(10,24,48,.82);
    --stroke:rgba(255,255,255,.78);
  }
  :root:not([data-theme="light"]){ color-scheme: light dark; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; overflow:hidden; background:#12356b; }
  body{
    font-family:'Luckiest Guy', Impact, 'Arial Black', system-ui, sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  canvas{ display:block; width:100%; height:100%; }

  /* the whole game lives in a landscape stage; if the phone is held
     upright we rotate the stage so the game is always played sideways */
  #stage{ position:fixed; top:0; left:0; transform-origin:0 0; overflow:hidden; }
  body.rot{ --st:10px; --sb:10px; --sl:10px; --sr:10px; }
  #btnAct{
    position:fixed; top:calc(8px + var(--st)); left:50%; transform:translateX(-50%) scale(.85);
    z-index:8; opacity:0; pointer-events:none; transition:opacity .15s ease, transform .15s ease;
    font-family:inherit; font-size:20px; letter-spacing:1px; color:#fff; padding:9px 26px;
    border-radius:14px; border:3px solid #ffe9a8; background:linear-gradient(#3f8f3a,#1d5a2a);
    box-shadow:0 4px 0 #123d1c, 0 8px 18px rgba(0,0,0,.35);
  }
  #btnAct.show{ opacity:1; pointer-events:auto; transform:translateX(-50%) scale(1); }
  #btnAct:active{ transform:translateX(-50%) translateY(3px) scale(1); box-shadow:0 2px 0 #123d1c; }
  #shop{
    position:fixed; inset:0; z-index:7; display:flex; flex-direction:column;
    background:linear-gradient(rgba(6,16,36,.94),rgba(4,10,26,.97));
    padding:calc(8px + var(--st)) calc(10px + var(--sr)) calc(8px + var(--sb)) calc(10px + var(--sl));
  }
  #shop.hide{ display:none; }
  .shopbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:2px 2px 8px; }
  .shoptitle{ color:#ffd98a; font-size:19px; text-shadow:0 2px 0 #a3400f; }
  .bank{ display:inline-flex; align-items:center; gap:6px; color:#ffe9a0; font-size:18px; margin-right:auto; }
  .bank i{ width:15px; height:15px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#ffe9a0,#f5a623 55%,#c25a12); display:inline-block; }
  .tab{ font-family:inherit; font-size:15px; color:#cfe4ff; background:rgba(255,255,255,.10);
    border:2px solid rgba(255,255,255,.28); border-radius:10px; padding:6px 14px; cursor:pointer; }
  .tab.on{ background:#2f74c4; color:#fff; border-color:#9fd8ec; }
  .closeb{ font-family:inherit; font-size:15px; color:#fff; background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3); border-radius:10px; padding:6px 14px; cursor:pointer; }
  .coderow{ display:flex; align-items:center; gap:8px; padding:0 2px 8px; flex-wrap:wrap; }
  #codeIn{ font-family:inherit; font-size:14px; letter-spacing:1px; color:#fff; width:150px;
    background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.28); border-radius:10px; padding:7px 10px; }
  #codeIn::placeholder{ color:rgba(255,255,255,.45); letter-spacing:0; }
  #codeGo{ font-family:inherit; font-size:14px; color:#fff; padding:7px 16px; border-radius:10px;
    border:2px solid #ffe9a8; background:linear-gradient(#e6902c,#a01f22); cursor:pointer; }
  #codeMsg{ font-family:system-ui,sans-serif; font-size:12px; color:#8ef08a; }
  #codeMsg.bad{ color:#ff9b8a; }
  .list{ flex:1; overflow-y:auto; display:grid; gap:10px; padding:2px 2px 10px;
    grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); align-content:start; }
  .item{ background:rgba(255,255,255,.07); border:2px solid rgba(255,255,255,.18);
    border-radius:14px; padding:8px; text-align:center; }
  .item.eq{ border-color:#7ee08a; background:rgba(120,230,140,.12); }
  .item canvas{ width:100%; height:auto; border-radius:9px; background:rgba(0,0,0,.25); display:block; }
  .item .nm{ color:#ffe9a0; font-size:15px; margin-top:6px; }
  .item .ds{ font-family:system-ui,sans-serif; font-size:11px; color:#c3d7ef; min-height:26px; margin:2px 0 4px; }
  .bars{ display:flex; gap:4px; justify-content:center; margin-bottom:6px; }
  .bars span{ font-family:system-ui,sans-serif; font-size:9px; color:#9fb8d6; }
  .bars b{ display:inline-block; width:22px; height:5px; border-radius:3px; background:rgba(255,255,255,.18); position:relative; overflow:hidden; }
  .bars b i{ position:absolute; inset:0 auto 0 0; background:#6ee86e; }
  .item button{ width:100%; font-family:inherit; font-size:14px; color:#fff; padding:8px 4px;
    border-radius:10px; border:2px solid #ffe9a8; background:linear-gradient(#e6902c,#a01f22); cursor:pointer; }
  .item button.own{ background:linear-gradient(#3f8f3a,#1d5a2a); }
  .item button:disabled{ opacity:.45; cursor:default; border-color:rgba(255,255,255,.35); background:rgba(255,255,255,.12); }
  #rotate{
    position:fixed; inset:auto 0 12px 0; z-index:9; text-align:center; pointer-events:none;
    font-family:system-ui,sans-serif; font-size:13px; color:rgba(255,255,255,.75);
    text-shadow:0 1px 4px rgba(0,0,0,.6); display:none;
  }
  body.rot #rotate{ display:block; }

  /* ---- Roblox-style touch controls ---- */
  #pad{ position:fixed; inset:auto 0 0 0; pointer-events:none; }
  .rb{
    position:fixed; pointer-events:auto; display:grid; place-items:center;
    border-radius:50%; border:3px solid var(--stroke);
    background:rgba(255,255,255,.22);
    -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
    box-shadow:0 4px 14px rgba(0,0,0,.28), inset 0 2px 10px rgba(255,255,255,.35);
    padding:0; touch-action:none; transition:transform .06s ease, background .06s ease;
  }
  .rb svg{ width:52%; height:52%; fill:#fff; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .rb.on{ background:rgba(255,255,255,.5); transform:scale(.93); }
  #btnL{ left:calc(18px + var(--sl)); bottom:calc(28px + var(--sb)); width:76px; height:76px; }
  #btnR{ left:calc(106px + var(--sl)); bottom:calc(28px + var(--sb)); width:76px; height:76px; }
  #btnU{ right:calc(20px + var(--sr)); bottom:calc(24px + var(--sb)); width:104px; height:104px; }

  /* ---- Screens ---- */
  #screen{
    position:fixed; inset:0; display:grid; place-items:center; padding:24px;
    padding-top:calc(24px + var(--st));
    background:radial-gradient(120% 80% at 50% 20%, rgba(8,22,48,.55), rgba(5,14,32,.88));
    z-index:5;
  }
  #screen.hide{ display:none; }
  .card{
    width:min(440px,100%); text-align:center; color:var(--paper);
    background:var(--panel); border:3px solid rgba(255,255,255,.5); border-radius:22px;
    padding:26px 22px 24px; box-shadow:0 18px 50px rgba(0,0,0,.5);
  }
  .card{ max-height:100%; overflow:auto; }
  body.short .card{ padding:16px 18px 16px; border-radius:18px; }
  body.short .card h1{ font-size:30px; }
  body.short .card h2{ font-size:16px; margin:4px 0 8px; }
  body.short .card p{ margin:4px 0; font-size:13px; }
  body.short .go{ margin-top:12px; font-size:20px; padding:10px 26px; }
  body.short .keys{ margin:10px 0 2px; }
  .card h1{ margin:0; font-size:clamp(30px,9vw,46px); line-height:1; letter-spacing:.5px;
    color:#ffd98a; text-shadow:0 3px 0 #a3400f, 0 6px 16px rgba(0,0,0,.45); }
  .card h2{ margin:6px 0 14px; font-size:clamp(16px,4.6vw,21px); color:#9fd8ec; }
  .card p{ margin:8px 0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.5; color:#d8e8fb; }
  .keys{ display:flex; gap:10px; justify-content:center; margin:16px 0 4px; flex-wrap:wrap; }
  .chip{ font-family:system-ui,sans-serif; font-size:13px; padding:7px 12px; border-radius:999px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.28); }
  .go{
    margin-top:18px; font-family:inherit; font-size:24px; letter-spacing:1px; color:#fff;
    padding:14px 34px; border-radius:16px; border:3px solid #ffe9a8; cursor:pointer;
    background:linear-gradient(#e6902c,#a01f22); box-shadow:0 6px 0 #6d1114, 0 10px 22px rgba(0,0,0,.4);
  }
  .go.alt{ background:linear-gradient(#3b6fb8,#1d3f74); border-color:#bfe0ff; box-shadow:0 6px 0 #142a4d, 0 10px 22px rgba(0,0,0,.4); margin-left:8px; }
  .go:active{ transform:translateY(3px); box-shadow:0 3px 0 #6d1114; }
  .stat{ font-size:20px; color:#ffd98a; margin-top:10px; }
  @media (prefers-reduced-motion: reduce){ .rb{ transition:none; } }
</style>
</head>
<body>
<div id="safeProbe" style="position:fixed;top:0;left:0;width:1px;height:env(safe-area-inset-top,0px);pointer-events:none;opacity:0"></div>

<div id="stage">
<canvas id="c"></canvas>

<div id="pad">
  <button class="rb" id="btnL" aria-label="Slow down">
    <svg viewBox="0 0 24 24"><path d="M15.5 3.8 7.9 11a1.4 1.4 0 0 0 0 2l7.6 7.2c.9.8 2.3.2 2.3-1V4.8c0-1.2-1.4-1.8-2.3-1z"/></svg>
  </button>
  <button class="rb" id="btnR" aria-label="Speed up">
    <svg viewBox="0 0 24 24"><path d="M8.5 3.8 16.1 11a1.4 1.4 0 0 1 0 2l-7.6 7.2c-.9.8-2.3.2-2.3-1V4.8c0-1.2 1.4-1.8 2.3-1z"/></svg>
  </button>
  <button class="rb" id="btnU" aria-label="Climb">
    <svg viewBox="0 0 24 24"><path d="M3.8 15.5 11 7.9a1.4 1.4 0 0 1 2 0l7.2 7.6c.8.9.2 2.3-1 2.3H4.8c-1.2 0-1.8-1.4-1-2.3z"/></svg>
  </button>
</div>

<div id="screen">
  <div class="card" id="card"></div>
</div>

<button id="btnAct">LAND</button>

<div id="shop" class="hide">
  <div class="shopbar">
    <span class="shoptitle">Hangar &amp; Shop</span>
    <span class="bank"><i></i><span id="shopGold">0</span></span>
    <button class="tab on" data-tab="planes">Planes</button>
    <button class="tab" data-tab="islands">Islands</button>
    <button id="shopClose" class="closeb">Close</button>
  </div>
  <div class="coderow">
    <input id="codeIn" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Secret code">
    <button id="codeGo">Enter</button>
    <span id="codeMsg"></span>
  </div>
  <div id="shopList" class="list"></div>
</div>

<div id="rotate">Turn your phone sideways for the full screen</div>
</div>

<script>
(() => {
"use strict";

// ---------- canvas ----------
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const CTX = ctx;
let W = 0, H = 0, DPR = 1, seaY = 0, ceilY = 0, jetX = 0, skyTop = 0;

const stage = document.getElementById('stage');
let rotated = false;

function layoutStage(){
  const vw = window.innerWidth, vh = window.innerHeight;
  rotated = vh > vw;                       // phone held upright -> rotate the stage
  document.body.classList.toggle('rot', rotated);
  if(rotated){
    stage.style.width = vh + 'px';
    stage.style.height = vw + 'px';
    stage.style.transform = 'rotate(90deg) translate(0px,' + (-vw) + 'px)';
  } else {
    stage.style.width = vw + 'px';
    stage.style.height = vh + 'px';
    stage.style.transform = 'none';
  }
  document.body.classList.toggle('short', Math.min(vw,vh) < 460);
}

function resize(){
  layoutStage();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = stage.clientWidth; H = stage.clientHeight;
  cvs.width = Math.floor(W * DPR); cvs.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  seaY = H * 0.855;
  skyTop = -H * 1.15;          // the stratosphere, about one screen above the clouds
  ceilY = skyTop + 26;
  jetX = Math.max(96, W * 0.28);
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ---------- helpers ----------
const probe = document.getElementById('safeProbe');
function safeTopPx(){ return rotated ? 10 : (probe ? probe.getBoundingClientRect().height : 0); }
function safeTop(){ return safeTopPx(); }
const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const lerp = (a,b,t) => a + (b-a)*t;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }

// ---------- haptics (native only; silently a no-op in a browser) ----------
const HAPTICS = (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics) || null;
function haptic(style){
  if(!HAPTICS) return;
  try{ HAPTICS.impact({ style: style || 'LIGHT' }); }catch(e){}
}

// ---------- audio (tiny blips) ----------
let AC = null;
function blip(freq, dur, type, vol){
  try{
    if(!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.05, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + (dur || 0.15));
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + (dur || 0.15));
  }catch(e){}
}

// ---------- power-up types ----------
const TYPES = [
  { id:'fuel',   color:'#ffb648', glow:'#ffe2a6', name:'Petrol drum', sub:'+50 fuel',            w:1.8 },
  { id:'speed',  color:'#ff5f4d', glow:'#ff9b7d', name:'Speed boost', sub:'Afterburners lit',    w:2 },
  { id:'lift',   color:'#ffd76b', glow:'#fff0b0', name:'Sky wings',   sub:'Climb like a rocket', w:1.6 },
  { id:'shield', color:'#bfe9ff', glow:'#7fd4ff', name:'Shield',      sub:'Bounce off anything', w:1.6 },
  { id:'repair', color:'#8ef08a', glow:'#ccffc2', name:'Repair',      sub:'One flame back',      w:1.4 },
  { id:'gold',   color:'#e79bff', glow:'#f3c8ff', name:'Treasure',    sub:'+250 gold',           w:1.4 }
];
const TYPE_W = TYPES.reduce((a,t) => a + t.w, 0);
function pickType(){
  let r = Math.random()*TYPE_W;
  for(const t of TYPES){ r -= t.w; if(r <= 0) return t; }
  return TYPES[0];
}

// ---------- hangar: planes ----------
const PLANES = [
  { id:'bluebird', name:'Bluebird', price:0, desc:'The trusty starter jet.',
    lift:1, burn:1, spd:1,
    col:{ body:'#2b4a7e', wing:'#7286a6', wing2:'#5d7396', fin:'#42608e', stab:'#35507a', canopy:'#4d9ec9', hot:'rgba(255,214,90,.95)', warm:'rgba(255,190,120,.75)' },
    shape:{ nose:74, fin:-44, wing:34 } },
  { id:'scarlet', name:'Scarlet Dart', price:450, desc:'Quick, but drinks petrol.',
    lift:0.95, burn:1.18, spd:1.18,
    col:{ body:'#a72229', wing:'#d8b0a4', wing2:'#b3746c', fin:'#c33a34', stab:'#8d1b23', canopy:'#ffd7a0', hot:'rgba(255,120,60,.95)', warm:'rgba(255,170,90,.75)' },
    shape:{ nose:82, fin:-40, wing:32 } },
  { id:'seahawk', name:'Sea Hawk', price:900, desc:'Sips fuel on long hops.',
    lift:1.06, burn:0.76, spd:1,
    col:{ body:'#1f6f74', wing:'#8fc4c2', wing2:'#5c9a9a', fin:'#2b8d8c', stab:'#165457', canopy:'#c6f0ff', hot:'rgba(150,255,220,.9)', warm:'rgba(120,220,210,.7)' },
    shape:{ nose:72, fin:-48, wing:38 } },
  { id:'nightowl', name:'Night Owl', price:1600, desc:'Climbs like it hates the ground.',
    lift:1.24, burn:0.95, spd:1.04,
    col:{ body:'#2a2140', wing:'#7a6ca8', wing2:'#4c3f74', fin:'#3c3060', stab:'#1d1730', canopy:'#b79bff', hot:'rgba(190,140,255,.95)', warm:'rgba(140,110,220,.7)' },
    shape:{ nose:70, fin:-52, wing:40 } },
  { id:'goldarrow', name:'Gold Arrow', price:3200, desc:'Fast, thrifty, ridiculous.',
    lift:1.16, burn:0.7, spd:1.26,
    col:{ body:'#b8862a', wing:'#f0dca0', wing2:'#c9a74e', fin:'#d8a53a', stab:'#8f6516', canopy:'#fff3c4', hot:'rgba(255,235,140,.95)', warm:'rgba(255,200,80,.75)' },
    shape:{ nose:86, fin:-46, wing:36 } }
];

// ---------- island skins ----------
const THEMES = [
  { id:'emerald', name:'Emerald Isles', price:0, desc:'Green hills and blue seas.',
    sky:['#123a86','#2f74c4','#79c2e6','#a8e0ef'], cloud:'#ffffff', cloudLine:'rgba(176,205,232,.9)',
    sea:['#4f9ff0','#205fae'], wave:'rgba(255,255,255,.55)', foam:'rgba(255,255,255,.85)',
    grass:'#4aa93a', grassTop:'#6ccb4a', cliff:'#c99a5f', sand:'#d8b075',
    rock:'#767f8c', rockTop:'#98a2b0', rockShade:'#5b6472',
    trunk:'#6b4a2a', leaf:'#2f7d2c', leaf2:'#3e9b38',
    mount:'#7d8592', mount2:'#9aa3b0', cap:'#e8eef5',
    field:'#eddb4f', field2:'#d4bf35', hut:'#e4d3b0', roof:'#b1452c', door:'#6d4f33',
    pier:'#8d5f34', pier2:'#6b4526', run:'#5f6068', runMark:'#e4e8ef' },
  { id:'sunset', name:'Sunset Sands', price:600, desc:'Golden dunes under a burning sky.',
    sky:['#3d1a5e','#a83f6e','#ef8a49','#ffd08a'], cloud:'#ffd9c2', cloudLine:'rgba(198,120,120,.8)',
    sea:['#e88a63','#7d3a63'], wave:'rgba(255,230,200,.5)', foam:'rgba(255,235,210,.85)',
    grass:'#c19b3c', grassTop:'#e2c055', cliff:'#a97c44', sand:'#f0d9a8',
    rock:'#8f6f57', rockTop:'#b38e70', rockShade:'#6b503c',
    trunk:'#6b4020', leaf:'#7f8f36', leaf2:'#a3ad48',
    mount:'#96705a', mount2:'#b48a6c', cap:'#ffe6bd',
    field:'#f0c44e', field2:'#d1a136', hut:'#f3e0b4', roof:'#96402c', door:'#6d4326',
    pier:'#8d5f34', pier2:'#6b4526', run:'#6b5747', runMark:'#ffeccd' },
  { id:'frost', name:'Frostpeak', price:1200, desc:'Snowbound rocks and icy water.',
    sky:['#0c2a54','#3a6ea8','#9fc7e0','#dcf0f7'], cloud:'#ffffff', cloudLine:'rgba(160,190,215,.9)',
    sea:['#7fc7e8','#215f92'], wave:'rgba(255,255,255,.7)', foam:'rgba(255,255,255,.95)',
    grass:'#dfeef6', grassTop:'#ffffff', cliff:'#b4c8d6', sand:'#cfe0e8',
    rock:'#77879a', rockTop:'#a8bccd', rockShade:'#56677a',
    trunk:'#4b4436', leaf:'#245a49', leaf2:'#eaf6ff',
    mount:'#8496a8', mount2:'#aabdcd', cap:'#ffffff',
    field:'#cfe3ec', field2:'#aec8d6', hut:'#e9f2f8', roof:'#4a6d8c', door:'#4b4436',
    pier:'#6f6250', pier2:'#544839', run:'#6c7c8c', runMark:'#ffffff' },
  { id:'volcano', name:'Ember Reach', price:2000, desc:'Ash, lava and a red sky.',
    sky:['#25070f','#6b1a1a','#c34a20','#f0a24a'], cloud:'#7a5450', cloudLine:'rgba(60,30,30,.75)',
    sea:['#7b3f52','#2a1230'], wave:'rgba(255,180,140,.45)', foam:'rgba(255,190,150,.7)',
    grass:'#3f3130', grassTop:'#5c4038', cliff:'#4a3530', sand:'#4a3b34',

const TILE = 14;
function makeIsland(x, seed){
  const r = mulberry32(seed);
  const tiles = 16 + Math.floor(r()*20);
  const peak = H * (0.10 + r()*0.16);
  const heights = [], feats = [];
  for(let i=0;i<tiles;i++){
    const edge = Math.min(i, tiles-1-i);
    const rise = clamp(edge/2.2, 0, 1);
    const wob = 0.78 + 0.22*Math.sin(i*0.7 + seed);
    let h = peak * rise * wob;
    h = Math.max(TILE, Math.round(h/TILE)*TILE);
    heights.push(h);
  }
  // flat landing strip: the longest run of level ground
  let strip = null, bi = -1, bl = 0, ci = 1, cl = 1;
  for(let k=2;k<tiles-1;k++){
    if(heights[k] === heights[k-1] && heights[k] > TILE){ cl++; }
    else { if(cl > bl){ bl = cl; bi = ci; } ci = k; cl = 1; }
  }
  if(cl > bl){ bl = cl; bi = ci; }
  if(bl >= 5) strip = { i0:bi, i1:bi+bl-1, h:heights[bi] };
  const onStrip = k => strip && k >= strip.i0-1 && k <= strip.i1+1;

  // bouncy jump pads, on flat ground away from the runway
  const pads = [];
  if(r() < 0.75){
    for(let tries=0;tries<8 && pads.length < 2;tries++){
      const idx = 2 + Math.floor(r()*(tiles-4));
      if(onStrip(idx) || pads.indexOf(idx) >= 0) continue;
      if(heights[idx] < TILE*1.5 || heights[idx] !== heights[idx+1]) continue;
      pads.push(idx);
    }
  }
  const isPad = k => pads.indexOf(k) >= 0;

  // rock spires — fly over them or between them
  const rocks = new Array(tiles).fill(false);
  const spires = r() < 0.6 ? 1 + (r() < 0.4 ? 1 : 0) : 0;
  for(let s2=0;s2<spires;s2++){
    const idx = 2 + Math.floor(r()*(tiles-4));
    if(onStrip(idx) || isPad(idx) || isPad(idx-1) || heights[idx] < TILE*1.5 || rocks[idx]) continue;
    heights[idx] += TILE*(3 + Math.floor(r()*5));
    rocks[idx] = true;
  }

  // surface features
  let i = 1;
  while(i < tiles-1){
    if(onStrip(i) || rocks[i] || isPad(i) || isPad(i-1)){ i += 1; continue; }
    const h = heights[i], roll = r();
    if(h > TILE*3.2 && roll < 0.22){ feats.push({k:'mount', i, s:1+r()*0.6}); i += 2; }
    else if(h > TILE*1.6 && roll < 0.5){ feats.push({k:'tree', i, s:0.8+r()*0.5}); i += 1; }
    else if(h > TILE*2.2 && roll < 0.62){ feats.push({k:'field', i, w:2+Math.floor(r()*2)}); i += 3; }
    else if(h > TILE*2 && roll < 0.72){ feats.push({k:'hut', i}); i += 2; }
    else i += 1;
  }
  const pierSide = r() < 0.6 ? (r()<0.5?-1:1) : 0;
  const name = ISLE_A[Math.floor(r()*ISLE_A.length)] + ' ' + ISLE_B[Math.floor(r()*ISLE_B.length)];
  return { x, w:tiles*TILE, tiles, heights, feats, rocks, strip, pads, padT:{}, pierSide, name, found:false, landed:false, seed };
}

function padAt(wx){
  for(const is of G.islands){
    if(wx < is.x - 6 || wx > is.x + is.w + 6) continue;
    const i = clamp(Math.floor((wx - is.x)/TILE), 0, is.tiles-1);
    for(const k of is.pads){
      if(i === k || i === k+1) return { is, k };
    }
  }
  return null;
}

function terrainTopAt(wx){
  for(let k=0;k<G.islands.length;k++){
    const is = G.islands[k];
    if(wx >= is.x && wx <= is.x + is.w){
      const i = clamp(Math.floor((wx - is.x)/TILE), 0, is.tiles-1);
      return seaY - is.heights[i];
    }
  }
  return seaY;
}

function ensureWorld(){
  while(G.nextIsland < G.scroll + W + 900){
    const is = makeIsland(G.nextIsland, (G.seed = (G.seed*1103515245 + 12345) & 0x7fffffff));
    G.islands.push(is);
    G.nextIsland += is.w + 420 + Math.random()*760;
  }
  while(G.nextPickup < G.scroll + W + 900){
    const t = pickType();
    const top = terrainTopAt(G.nextPickup);
    let y;
    if(Math.random() < 0.28){            // a few treats in the thin air
      y = skyTop + 90 + Math.random()*(H*0.9);
    } else {
      y = H*0.12 + Math.random()*(seaY - H*0.12 - 150);
      y = Math.min(y, top - 70);
      y = clamp(y, H*0.08, seaY - 70);
    }
    G.pickups.push({ x:G.nextPickup, y, type:t, phase:Math.random()*6.28, got:false });
    G.nextPickup += 230 + Math.random()*430;
  }
  while(G.nextBounce < G.scroll + W + 900){
    G.clouds.push({
      x: G.nextBounce,
      y: skyTop + 150 + Math.random()*(H*0.95),
      s: 1.35 + Math.random()*0.45,
      squash: 0, phase: Math.random()*6.28
    });
    G.nextBounce += 260 + Math.random()*420;
  }
  G.clouds = G.clouds.filter(c => c.x > G.scroll - 400);
  G.islands = G.islands.filter(i => i.x + i.w > G.scroll - 300);
  G.pickups = G.pickups.filter(p => p.x > G.scroll - 200 && !p.got);
}

function reset(){
  G.t=0; G.scroll=0; G.speed=4; G.jetY=H*0.4; G.vy=0; G.tilt=0;
  G.health=3; G.gold=0; G.found=0; G.dist=0; G.landings=0;
  G.fuel=G.maxFuel; G.dry=false; G.ranDry=false; G.warnT=0; G.land=null;
  G.camY=0; G.clouds=[]; G.nextBounce=900; G.highBest=0;
  G.islands=[]; G.pickups=[]; G.puffs=[]; G.floats=[];
  G.fx={speed:0,lift:0,shield:0}; G.invuln=0; G.shake=0; G.banner=null;
  G.nextIsland=700; G.nextPickup=560; G.seed=(Math.random()*1e9)|0;
  ensureWorld();
}

// ---------- update ----------
function addFloat(text, color){
  G.floats.push({ text, color, x:jetX, y:G.jetY-60, life:1.3 });
}
function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a = Math.random()*6.28, sp = 1+Math.random()*4;
    G.puffs.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1, life:0.6+Math.random()*0.5, color, r:3+Math.random()*4});
  }
}

function hit(){
  if(G.invuln > 0) return;
  if(SAVE.god){
    G.vy = -8; G.invuln = 0.6; G.shake = 6;
    G.fuel = Math.max(G.fuel, 25);
    burst(jetX, G.jetY+18, '#ffe9a0', 12); blip(620,0.1,'triangle',0.04); haptic('LIGHT');
    return;
  }
  if(G.fx.shield > 0){
    G.vy = -7; G.invuln = 0.5; G.shake = 8;
    burst(jetX, G.jetY+18, '#bfe9ff', 14); blip(520,0.12,'triangle',0.05); haptic('LIGHT');
    return;
  }
  G.health--; G.invuln = 1.4; G.shake = 16; G.vy = -7.5;
  G.fx.speed = 0;
  G.ranDry = G.fuel <= 0;
  if(G.fuel < 20){ G.fuel = 20; G.dry = false; }
  burst(jetX, G.jetY+18, '#ffd08a', 20);
  blip(150,0.25,'sawtooth',0.06); haptic('MEDIUM');
  if(G.health <= 0){ gameOver(); }
}

function collect(p){
  p.got = true;
  const t = p.type;
  if(t.id==='speed') G.fx.speed = 7;
  if(t.id==='lift') G.fx.lift = 9;
  if(t.id==='shield') G.fx.shield = 9;
  if(t.id==='repair') G.health = Math.min(G.maxHealth, G.health+1);
  if(t.id==='gold') G.gold += 250;
  if(t.id==='fuel'){ G.fuel = Math.min(G.maxFuel, G.fuel + 50); G.dry = false; }
  G.gold += 50;
  G.banner = { life:1.5, name:t.name, sub:t.sub, color:t.color };
  burst(p.x - G.scroll, p.y, t.color, 16);
  blip(880,0.09,'square',0.05); setTimeout(()=>blip(1320,0.12,'square',0.045), 70);
}

function commonTick(dt){
  const sec = dt/60;
  const camTarget = clamp(G.jetY - H*0.52, skyTop, 0);
  G.camY = lerp(G.camY, camTarget, 0.09*dt);
  for(const c of G.clouds) if(c.squash > 0) c.squash = Math.max(0, c.squash - 3.2*sec);
  for(const is of G.islands){
    for(const k in is.padT) if(is.padT[k] > 0) is.padT[k] = Math.max(0, is.padT[k] - 3.4*sec);
  }
  for(const k in G.fx) if(G.fx[k] > 0) G.fx[k] = Math.max(0, G.fx[k] - sec);
  if(G.invuln > 0) G.invuln -= sec;
  if(G.shake > 0) G.shake = Math.max(0, G.shake - dt*0.8);
  if(G.banner){ G.banner.life -= sec; if(G.banner.life <= 0) G.banner = null; }
  for(const q of G.puffs){ q.x += q.vx*dt; q.y += q.vy*dt; q.vy += 0.12*dt; q.life -= sec; }
  G.puffs = G.puffs.filter(q => q.life > 0);
  for(const f of G.floats){ f.y -= 0.7*dt; f.life -= sec; }
  G.floats = G.floats.filter(f => f.life > 0);
}

// the flat strip the jet is currently above, if any
function stripUnder(){
  const wx = G.scroll + jetX;
  for(const is of G.islands){
    if(!is.strip) continue;
    const x0 = is.x + is.strip.i0*TILE;
    const x1 = is.x + (is.strip.i1 + 1)*TILE;
    if(wx > x0 - 420 && wx < x1 - 24) return { is, x0, x1, top: seaY - is.strip.h };
  }
  return null;
}

function beginLanding(){
  const z = stripUnder();
  if(!z) return;
  z.targetX = clamp(z.x0 + (z.x1 - z.x0)*0.55, z.x0 + 30, z.x1 - 28);
  G.land = z; state = 'landing';
  input.up = input.left = input.right = false;
  document.querySelectorAll('.rb').forEach(b => b.classList.remove('on'));
  blip(330,0.12,'triangle',0.04);
}

function touchdown(){
  state = 'landed';
  G.fuel = G.maxFuel; G.dry = false; G.vy = 0; G.tilt = 0;
  G.gold += 150; G.landings++;
  if(G.land && !G.land.is.landed){ G.land.is.landed = true; }
  G.banner = { life:1.6, name:'Refuelled', sub:'Tanks full · +150 gold', color:'#ffb648' };
  burst(jetX, G.jetY + 16, '#e8e2cf', 14);
  blip(620,0.12,'triangle',0.05); setTimeout(()=>blip(880,0.14,'triangle',0.045), 110); haptic('LIGHT');
}

function takeOff(){
  state = 'play'; G.speed = 6; G.vy = -8.5; G.invuln = 1.1; G.land = null;
  blip(440,0.1,'square',0.045);
}

function updateLanding(dt){
  G.t += dt;
  const z = G.land;
  const left = z.targetX - (G.scroll + jetX);
  // glide in: hold enough speed to reach the runway, then settle on the spot
  const want = clamp(left*0.045, 0, 9);
  G.speed = left > 2 ? Math.max(0.9, Math.min(G.speed, Math.max(want, 1.6))) : Math.max(0, G.speed - 0.35*dt);
  G.scroll += G.speed*dt;
  if(left <= 2 && G.speed < 0.5){ G.scroll = z.targetX - jetX; G.speed = 0; }
  const ty = z.top - 15;
  const rate = left > 120 ? 0.035 : 0.075;
  G.jetY = lerp(G.jetY, ty, rate*dt);
  G.vy = 0;
  G.tilt = lerp(G.tilt, 0, 0.12*dt);
  G.fuel = Math.max(0, G.fuel - 0.8*(dt/60));
  if(G.speed <= 0.06 && left <= 3 && Math.abs(G.jetY - ty) < 2.5) touchdown();
  commonTick(dt);
}

function update(dt){
  G.t += dt;
  const sec = dt/60;

  // petrol
  const burnBase = (input.right ? 3.4 : input.left ? 1.4 : 2.1) * PL.burn;
  G.fuel = Math.max(0, G.fuel - burnBase*(G.fx.speed > 0 ? 1.6 : 1)*sec);
  const dry = G.fuel <= 0;
  if(dry && !G.dry){
    G.dry = true; G.fx.speed = 0;
    addFloat('Out of petrol — glide to a runway', '#ffb648');
    blip(180,0.4,'sawtooth',0.05);
  }
  if(!dry) G.dry = false;
  if(G.fuel < 25 && !dry){
    G.warnT -= sec;
    if(G.warnT <= 0){ G.warnT = 1.1; blip(760,0.07,'square',0.03); }
  }

  // horizontal
  const target = dry ? 2.6 : (input.right ? 9.2*PL.spd : input.left ? 2.2 : 4.8*PL.spd);
  G.speed = lerp(G.speed, target, 0.06*dt);
  const vx = G.speed * (G.fx.speed > 0 && !dry ? 1.9 : 1);
  G.scroll += vx * dt;
  G.dist += vx * dt;
  G.gold += vx * dt * 0.02;

  // vertical
  const thrust = (G.fx.lift > 0 ? 0.98 : 0.64) * PL.lift;
  const climbCap = G.fx.lift > 0 ? -11 : -9;
  if(input.up && !dry && G.vy > climbCap) G.vy -= thrust * dt;
  G.vy += 0.30 * dt;
  G.vy = clamp(G.vy, -22, 9.5);          // bounces can beat the engine
  G.jetY += G.vy * dt;
  if(G.jetY < ceilY){ G.jetY = ceilY; G.vy = Math.max(0, G.vy); }

  // altitude: 0 at the sea, 1 at the top of the sky
  const alt = clamp((seaY - G.jetY) / (seaY - skyTop), 0, 1);
  G.gold += vx * dt * 0.02 * 2.2 * alt;   // thin-air bonus on top of the usual trickle
  if(alt > 0.62 && G.highBest < 0.62){ addFloat('Stratosphere! Gold pays double up here', '#bfe9ff'); }
  if(alt > G.highBest) G.highBest = alt;

  // bounce clouds
  if(G.vy > 0){
    for(const c of G.clouds){
      const surf = c.y - 34*c.s;
      if(Math.abs(c.x - (G.scroll + jetX)) < 76*c.s &&
         G.jetY + 14 > surf && G.jetY + 14 < surf + 30 + G.vy*2){
        const power = 12.5 + 8*alt;
        G.vy = -power; G.jetY = surf - 16; c.squash = 1;
        G.gold += 15;
        burst(jetX, G.jetY + 26, '#ffffff', 8);
        blip(520 + 420*alt, 0.1, 'sine', 0.045); haptic('LIGHT');
        break;
      }
    }
  }
  G.tilt = lerp(G.tilt, clamp(G.vy*0.05, -0.42, 0.5), 0.2*dt);

  commonTick(dt);
  ensureWorld();

  // pickups
  const wx = G.scroll + jetX;
  for(const p of G.pickups){
    if(p.got) continue;
    const py = p.y + Math.sin(G.t*0.05 + p.phase)*6;
    if(Math.abs(p.x - wx) < 42 && Math.abs(py - G.jetY) < 40) collect(p);
  }

  // discovery
  for(const is of G.islands){
    if(!is.found && wx > is.x + is.w*0.5){
      is.found = true; G.found++; G.gold += 100;
      addFloat(is.name + ' found!', '#ffe9a8');
      blip(660,0.1,'triangle',0.04);
    }
  }

  // collisions
  const top = terrainTopAt(wx);
  if(G.jetY + 15 > seaY){
    G.jetY = seaY - 15;
    burst(jetX, seaY, '#cfeaff', 18);
    hit();
  } else if(G.jetY + 14 > top){
    const pad = padAt(wx);
    if(pad && G.vy > -1){
      pad.is.padT[pad.k] = 1;
      G.jetY = top - 16; G.vy = -18.5; G.gold += 25;
      burst(jetX, top, '#ffd54a', 14);
      blip(300,0.07,'square',0.05); setTimeout(()=>blip(900,0.14,'square',0.05), 60); haptic('LIGHT');
    } else {
      G.jetY = top - 14;
      hit();
    }
  }

}

// ---------- drawing ----------
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function darken(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r = Math.round(((n>>16)&255)*(1-f)), g = Math.round(((n>>8)&255)*(1-f)), b = Math.round((n&255)*(1-f));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function drawSky(){
  const g = ctx.createLinearGradient(0, skyTop, 0, seaY);
  g.addColorStop(0, darken(TM.sky[0], 0.74));
  g.addColorStop(0.40, darken(TM.sky[0], 0.34));
  g.addColorStop(0.62, TM.sky[0]);
  g.addColorStop(0.82, TM.sky[1]);
  g.addColorStop(0.94, TM.sky[2]);
  g.addColorStop(1, TM.sky[3]);
  ctx.fillStyle = g; ctx.fillRect(0, skyTop - 600, W, seaY - skyTop + 900);

  // stars, only worth seeing when you are up there
  const hi = clamp((-G.camY) / (-skyTop) * 1.5, 0, 1);
  if(hi > 0.05){
    ctx.globalAlpha = hi * 0.8;
    ctx.fillStyle = '#ffffff';
    const off = (G.scroll * 0.12) % (W + 200);
    for(let i=0;i<46;i++){
      const sd = i*97.13;
      let x = ((Math.sin(sd)*0.5+0.5)*(W+200)) - off; if(x < -20) x += W + 200;
      const y = skyTop + 40 + (Math.sin(sd*2.7)*0.5+0.5)*(H*0.95);
      const r = 0.8 + (Math.sin(sd*5.1)*0.5+0.5)*1.4;
      ctx.fillRect(x, y, r, r);
    }
    ctx.globalAlpha = 1;
  }
}

function cloudShape(){
  ctx.beginPath();
  ctx.ellipse(-52,-14,30,16,0,0,6.283);
  ctx.ellipse(-14,-26,38,26,0,0,6.283);
  ctx.ellipse(26,-18,30,20,0,0,6.283);
  ctx.ellipse(58,-11,22,13,0,0,6.283);
  ctx.rect(-80,-13,160,13);
  ctx.closePath();
}
function drawCloud(x,y,s,a){
  ctx.save(); ctx.globalAlpha = a; ctx.translate(x,y); ctx.scale(s,s);
  ctx.fillStyle = TM.cloud; cloudShape(); ctx.fill();
  ctx.strokeStyle = TM.cloudLine; ctx.lineWidth = 3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(-6,-6); ctx.quadraticCurveTo(8,4,24,-6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(30,-4); ctx.quadraticCurveTo(40,2,50,-4); ctx.stroke();
  ctx.restore();
}
const cloudLayers = [
  { p:0.10, n:3, s:1.1,  a:0.22, ys:[-1.00,-0.35] },  // wisps in the thin air
  { p:0.16, n:7, s:1.25, a:0.50, ys:[0.10,0.30] },
  { p:0.34, n:6, s:1.7,  a:0.82, ys:[0.16,0.50] },
  { p:0.62, n:5, s:2.2,  a:0.95, ys:[0.30,0.66] }
];
function drawClouds(front){
  const layers = front ? [{p:1.15,n:3,s:2.9,a:0.5,ys:[0.55,0.95]}] : cloudLayers;
  for(const L of layers){
    const span = W + 420;
    const off = (G.scroll * L.p) % span;
    for(let i=0;i<L.n;i++){
      const seed = i*137.5 + L.p*991;
      const base = (i/L.n)*span + (Math.sin(seed)*0.5+0.5)*160;
      let x = base - off; if(x < -220) x += span;
      const t = (Math.sin(seed*2.3)*0.5+0.5);
      const y = H*lerp(L.ys[0], L.ys[1], t);
      drawCloud(x, y, L.s*(0.8+0.4*t), L.a);
    }
  }
}

function drawBounceCloud(c){
  const x = c.x - G.scroll;
  if(x < -220 || x > W + 220) return;
  const q = c.squash;
  const bob = Math.sin(G.t*0.03 + c.phase)*4;
  ctx.save();
  ctx.translate(x, c.y + bob);
  ctx.scale(c.s * (1 + q*0.22), c.s * (1 - q*0.45));
  // glow
  ctx.shadowColor = 'rgba(150,230,255,.9)'; ctx.shadowBlur = 16 + q*22;
  ctx.fillStyle = '#ffffff'; cloudShape(); ctx.fill();
  ctx.shadowBlur = 0;
  // springy rim + sparkles
  ctx.strokeStyle = 'rgba(120,225,255,' + (0.55 + q*0.4) + ')'; ctx.lineWidth = 3;
  cloudShape(); ctx.stroke();
  ctx.fillStyle = 'rgba(120,225,255,.9)';
  for(let i=0;i<3;i++){
    const sx = -40 + i*40, sy = -34 - 6*Math.sin(G.t*0.06 + i + c.phase);
    ctx.beginPath(); ctx.moveTo(sx, sy-5); ctx.lineTo(sx+3, sy); ctx.lineTo(sx, sy+5); ctx.lineTo(sx-3, sy); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawSea(){
  const g = ctx.createLinearGradient(0,seaY,0,H);
  g.addColorStop(0,TM.sea[0]); g.addColorStop(1,TM.sea[1]);
  ctx.fillStyle = g; ctx.fillRect(0,seaY,W,H-seaY);
  ctx.fillStyle = TM.foam;
  ctx.fillRect(0,seaY,W,3);
  ctx.strokeStyle = TM.wave; ctx.lineWidth = 3; ctx.lineCap='round';
  const off = G.scroll % 120;
  for(let row=0; row<3; row++){
    const yy = seaY + 22 + row*30;
    if(yy > H) break;
    for(let x=-120; x<W+120; x+=120){
      const px = x - off*(1 - row*0.18) + (row%2)*60;
      ctx.beginPath(); ctx.moveTo(px,yy); ctx.lineTo(px+12,yy-7); ctx.lineTo(px+24,yy); ctx.stroke();
    }
  }
}

function drawIsland(is){
  const sx = is.x - G.scroll;
  if(sx > W + 40 || sx + is.w < -40) return;
  // pier
  if(is.pierSide !== 0){
    const px = is.pierSide < 0 ? sx - 46 : sx + is.w + 6;
    ctx.fillStyle = TM.pier;
    ctx.fillRect(px, seaY - 6, 42, 7);
    ctx.fillStyle = TM.pier2;
    for(let i=0;i<4;i++) ctx.fillRect(px + 4 + i*11, seaY + 1, 4, 14);
  }
  for(let i=0;i<is.tiles;i++){
    const h = is.heights[i], x = sx + i*TILE, top = seaY - h;
    if(is.rocks && is.rocks[i]){
      // rock spire — solid obstacle
      ctx.fillStyle = TM.rock; ctx.fillRect(x, top, TILE+0.5, h + 8);
      ctx.fillStyle = TM.rockTop; ctx.fillRect(x, top, TILE+0.5, 7);
      ctx.fillStyle = TM.rockShade; ctx.fillRect(x + TILE - 5, top + 7, 5, h - 7);
      ctx.fillStyle = TM.sand; ctx.fillRect(x, seaY - 12, TILE+0.5, 20);
      continue;
    }
    // body / grass
    ctx.fillStyle = TM.grass; ctx.fillRect(x, top, TILE+0.5, h + 8);
    // sand base
    ctx.fillStyle = TM.sand; ctx.fillRect(x, seaY - 12, TILE+0.5, 20);
    // grass cap + cliff shading
    ctx.fillStyle = TM.grassTop; ctx.fillRect(x, top, TILE+0.5, 5);
    const nb = is.heights[i+1];
    if(nb !== undefined && nb < h - TILE*0.5){
      ctx.fillStyle = TM.cliff; ctx.fillRect(x + TILE - 4, top + 5, 4, h - (nb) - 5);
    }
  }
  // runway
  if(is.strip){
    const rx = sx + is.strip.i0*TILE, rw = (is.strip.i1 - is.strip.i0 + 1)*TILE, ry = seaY - is.strip.h;
    ctx.fillStyle = TM.run; ctx.fillRect(rx, ry - 1, rw, 9);
    ctx.fillStyle = TM.runMark;
    for(let k=8;k<rw-14;k+=20) ctx.fillRect(rx + k, ry + 3, 11, 2);
    ctx.fillStyle = '#ffd54a';
    ctx.fillRect(rx, ry - 4, 4, 12); ctx.fillRect(rx + rw - 4, ry - 4, 4, 12);
  }
  // jump pads
  for(const k of is.pads){
    const px = sx + k*TILE, py = seaY - is.heights[k];
    const q = is.padT[k] || 0;
    const h = 12 - q*7;
    ctx.fillStyle = '#5a5f6b'; ctx.fillRect(px - 2, py - 3, TILE*2 + 4, 4);
    ctx.strokeStyle = '#b9c2cf'; ctx.lineWidth = 3;
    for(let z=0;z<3;z++){
      const zy = py - 4 - (z+1)*(h/3.4);
      ctx.beginPath(); ctx.moveTo(px + 2, zy + 3); ctx.lineTo(px + TILE*2 - 2, zy); ctx.stroke();
    }
    const ty = py - 5 - h;
    ctx.fillStyle = '#d8323c'; ctx.fillRect(px - 5, ty, TILE*2 + 10, 7);
    ctx.fillStyle = '#ffffff';
    for(let z=0;z<3;z++) ctx.fillRect(px - 2 + z*11, ty + 2, 6, 3);
    ctx.fillStyle = 'rgba(255,214,90,' + (0.25 + q*0.6) + ')';
    ctx.beginPath(); ctx.moveTo(px + TILE, ty - 8 - q*10); ctx.lineTo(px + TILE + 7, ty - 2); ctx.lineTo(px + TILE - 7, ty - 2); ctx.closePath(); ctx.fill();
  }
  // features
  for(const f of is.feats){
    const x = sx + f.i*TILE, gy = seaY - is.heights[f.i];
    if(f.k === 'tree'){
      const s = f.s;
      ctx.fillStyle = TM.trunk; ctx.fillRect(x+5, gy-8*s, 4, 9*s);
      ctx.fillStyle = TM.leaf; ctx.fillRect(x-1, gy-20*s, 16, 9*s);
      ctx.fillRect(x+2, gy-27*s, 10, 8*s);
      ctx.fillStyle = TM.leaf2; ctx.fillRect(x+2, gy-19*s, 8, 4*s);
    } else if(f.k === 'mount'){
      const s = f.s, hgt = 26*s, wdt = 30*s;
      ctx.fillStyle = TM.mount;
      ctx.beginPath(); ctx.moveTo(x-wdt/3, gy); ctx.lineTo(x+wdt/2, gy-hgt); ctx.lineTo(x+wdt*1.05, gy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = TM.mount2;
      ctx.beginPath(); ctx.moveTo(x+wdt/2, gy-hgt); ctx.lineTo(x+wdt*1.05, gy); ctx.lineTo(x+wdt*0.55, gy); ctx.closePath(); ctx.fill();
      ctx.fillStyle = TM.cap;
      ctx.beginPath(); ctx.moveTo(x+wdt/2, gy-hgt); ctx.lineTo(x+wdt*0.32, gy-hgt*0.68); ctx.lineTo(x+wdt*0.7, gy-hgt*0.68); ctx.closePath(); ctx.fill();
    } else if(f.k === 'field'){
      const w = f.w*TILE;
      ctx.fillStyle = TM.field; ctx.fillRect(x, gy-9, w, 9);
      ctx.fillStyle = TM.field2;
      for(let k=0;k<w;k+=6) ctx.fillRect(x+k, gy-9, 2, 9);
    } else if(f.k === 'hut'){
      ctx.fillStyle = TM.hut; ctx.fillRect(x, gy-14, 18, 14);
      ctx.fillStyle = TM.roof;
      ctx.beginPath(); ctx.moveTo(x-3, gy-14); ctx.lineTo(x+9, gy-25); ctx.lineTo(x+21, gy-14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = TM.door; ctx.fillRect(x+6, gy-8, 6, 8);
    }
  }
  // foam at the waterline
  ctx.fillStyle = TM.foam;
  ctx.fillRect(sx-6, seaY+4, is.w+12, 4);
}

// --- glyph icons in the style of the skill sheet ---
function glyph(id){
  ctx.lineWidth = 4.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if(id === 'speed'){
    for(let i=0;i<6;i++){
      const a = i*Math.PI/3 + 0.2;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*5, Math.sin(a)*5);
      ctx.lineTo(Math.cos(a)*17, Math.sin(a)*17); ctx.stroke();
      const b = a + 0.32;
      ctx.beginPath(); ctx.moveTo(Math.cos(a)*11, Math.sin(a)*11);
      ctx.lineTo(Math.cos(b)*18, Math.sin(b)*18); ctx.stroke();
    }
  } else if(id === 'lift'){
    for(let i=0;i<3;i++){
      const y = 10 - i*10;
      ctx.beginPath(); ctx.moveTo(-13,y); ctx.lineTo(0,y-9); ctx.lineTo(13,y); ctx.stroke();
    }
  } else if(id === 'shield'){
    ctx.beginPath();
    ctx.moveTo(0,-17); ctx.quadraticCurveTo(14,-14,14,-4);
    ctx.quadraticCurveTo(14,10,0,18); ctx.quadraticCurveTo(-14,10,-14,-4);
    ctx.quadraticCurveTo(-14,-14,0,-17); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,-2); ctx.lineTo(0,5); ctx.lineTo(6,-2); ctx.stroke();
  } else if(id === 'fuel'){
    ctx.beginPath();
    ctx.moveTo(-11,-10); ctx.lineTo(7,-10); ctx.lineTo(7,15); ctx.lineTo(-11,15); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7,-10); ctx.lineTo(-7,-15); ctx.lineTo(1,-15); ctx.lineTo(1,-10); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7,-5); ctx.lineTo(15,-5); ctx.lineTo(15,8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6,4); ctx.lineTo(2,4); ctx.stroke();
  } else if(id === 'repair'){
    ctx.beginPath();
    ctx.moveTo(-12,12); ctx.quadraticCurveTo(-14,-12,12,-14);
    ctx.quadraticCurveTo(14,12,-12,12); ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-8,9); ctx.quadraticCurveTo(2,0,9,-10); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(-14,10); ctx.lineTo(-10,-8); ctx.lineTo(0,2); ctx.lineTo(10,-8); ctx.lineTo(14,10);
    ctx.closePath(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,-13,3.5,0,6.283); ctx.stroke();
  }
}

function drawPlaneShape(c, P){
  const S = P.shape, K = P.col;
  const N = S.nose, F = S.fin, WG = S.wing;
  // far wing
  c.fillStyle = K.wing2;
  c.beginPath(); c.moveTo(-6,-6); c.lineTo(-56,-(WG+6)); c.lineTo(-34,-(WG+6)); c.lineTo(16,-4); c.closePath(); c.fill();
  // tail fin
  c.fillStyle = K.fin;
  c.beginPath(); c.moveTo(-30,-6); c.lineTo(-24,F); c.lineTo(-12,F); c.lineTo(-6,-6); c.closePath(); c.fill();
  // rear stabiliser
  c.fillStyle = K.stab;
  c.beginPath(); c.moveTo(-32,-14); c.lineTo(-58,-20); c.lineTo(-58,-12); c.lineTo(-30,-8); c.closePath(); c.fill();
  // fuselage
  c.fillStyle = K.body;
  c.beginPath();
  c.moveTo(-58,-8); c.lineTo(-16,-16); c.lineTo(30,-16);
  c.quadraticCurveTo(N-12,-12,N,0);
  c.quadraticCurveTo(N-12,12,30,16); c.lineTo(-20,15); c.lineTo(-58,8);
  c.closePath(); c.fill();
  // belly shade
  c.fillStyle = 'rgba(8,16,34,.42)';
  c.beginPath(); c.moveTo(-58,8); c.lineTo(-20,15); c.lineTo(30,16); c.quadraticCurveTo(N-16,12,N-4,3); c.lineTo(-56,4); c.closePath(); c.fill();
  // canopy
  c.fillStyle = K.canopy;
  c.beginPath(); c.moveTo(14,-15); c.quadraticCurveTo(44,-19,56,-6); c.lineTo(16,-4); c.closePath(); c.fill();
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2;
  c.beginPath(); c.moveTo(26,-14); c.lineTo(20,-5); c.stroke();
  c.beginPath(); c.moveTo(34,-14); c.lineTo(27,-5); c.stroke();
  // near wing
  c.fillStyle = K.wing;
  c.beginPath(); c.moveTo(8,2); c.lineTo(-52,WG); c.lineTo(-26,WG); c.lineTo(30,6); c.closePath(); c.fill();
  // flame emblem on the fin
  c.save(); c.translate(-19, F + 12); drawFlameFace(0.85, c); c.restore();
}

function drawJet(){
  const boosting = G.fuel > 0 && (G.fx.speed > 0 || input.right);
  const engineOff = G.fuel <= 0 || state === 'landed';
  ctx.save();
  ctx.translate(jetX, G.jetY);
  ctx.rotate(G.tilt);
  if(G.invuln > 0 && Math.floor(G.t/4) % 2 === 0) ctx.globalAlpha = 0.45;

  // exhaust
  const flick = 0.7 + Math.random()*0.5;
  const len = (engineOff ? 0 : boosting ? 52 : 24) * flick;
  if(len > 0){
    const eg = ctx.createLinearGradient(-58,0,-58-len,0);
    eg.addColorStop(0, boosting ? PL.col.hot : PL.col.warm);
    eg.addColorStop(1,'rgba(255,90,40,0)');
    ctx.fillStyle = eg;
    ctx.beginPath(); ctx.moveTo(-56,-7); ctx.lineTo(-56-len,0); ctx.lineTo(-56,7); ctx.closePath(); ctx.fill();
  }

  drawPlaneShape(ctx, PL);

  // shield bubble
  if(G.fx.shield > 0){
    ctx.strokeStyle = 'rgba(180,230,255,'+(0.55 + 0.25*Math.sin(G.t*0.15))+')';
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(4,0,74,0,6.283); ctx.stroke();
  }
  ctx.restore();
}

function coin(x,y,r){
  const g = ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.15,x,y,r);
  g.addColorStop(0,'#ffe9a0'); g.addColorStop(0.5,'#f5a623'); g.addColorStop(1,'#c25a12');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,6.283); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  ctx.beginPath(); ctx.ellipse(x-r*0.3,y-r*0.4,r*0.28,r*0.16,-0.6,0,6.283); ctx.fill();
}

function outlineText(text, x, y, size, fill, align){
  ctx.font = size + "px 'Luckiest Guy', Impact, 'Arial Black', sans-serif";
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(4, size*0.22);
  ctx.strokeStyle = 'rgba(8,18,40,.85)'; ctx.strokeText(text,x,y);
  ctx.fillStyle = fill; ctx.fillText(text,x,y);
}

function drawHUD(){
  const pad = 16;
  const top = safeTop() + 34;
  // health flames
  for(let i=0;i<G.maxHealth;i++){
    const x = pad + 20 + i*34, y = top;
    ctx.save(); ctx.translate(x,y);
    if(i < G.health){ drawFlameFace(1.05); }
    else { ctx.globalAlpha = 0.25; ctx.fillStyle = '#0b1b38';
      ctx.beginPath(); ctx.arc(0,0,10,0,6.283); ctx.fill(); }
    ctx.restore();
  }
  // gold
  coin(W - pad - 22, top, 13);
  outlineText(String(Math.floor(G.gold)), W - pad - 44, top+1, 30, '#ffe9a0', 'right');
  // islands found + altitude
  outlineText('Islands ' + G.found, W - pad - 8, top + 34, 19, '#cfe9ff', 'right');
  const altM = Math.max(0, Math.round((seaY - G.jetY)/5));
  outlineText('Alt ' + altM + 'm', W - pad - 8, top + 60, 19, altM > 300 ? '#bfe9ff' : '#9fc4e6', 'right');
  // fuel gauge
  const fy = top + 32, fw = 152;
  ctx.fillStyle = 'rgba(8,18,40,.55)'; rr(pad, fy-11, fw, 22, 11); ctx.fill();
  const frac = clamp(G.fuel/G.maxFuel, 0, 1);
  const fcol = frac > 0.5 ? '#6ee86e' : frac > 0.22 ? '#ffd24a' : '#ff5f4d';
  if(frac <= 0.22 && Math.floor(G.t/10) % 2 === 0) ctx.globalAlpha = 0.45;
  ctx.fillStyle = fcol; rr(pad+3, fy-8, Math.max(0,(fw-6)*frac), 16, 8); ctx.fill();
  ctx.globalAlpha = 1;
  outlineText(G.fuel <= 0 ? 'NO PETROL' : 'PETROL', pad + 12, fy, 15, '#0b1b38');

  if(SAVE.god){
    outlineText('INVINCIBLE', pad, fy + 26, 15, '#ffe9a0');
  }
  // active power-ups
  let by = fy + (SAVE.god ? 52 : 30);
  const acts = [
    ['speed', G.fx.speed, 7, '#ff5f4d', 'Speed'],
    ['lift', G.fx.lift, 9, '#ffd76b', 'Wings'],
    ['shield', G.fx.shield, 9, '#bfe9ff', 'Shield']
  ];
  for(const [id, v, max, col, label] of acts){
    if(v <= 0) continue;
    ctx.fillStyle = 'rgba(8,18,40,.5)'; rr(pad, by-9, 122, 18, 9); ctx.fill();
    ctx.fillStyle = col; rr(pad+2, by-7, 118*(v/max), 14, 7); ctx.fill();
    outlineText(label, pad + 10, by, 14, '#0b1b38');
    by += 24;
  }
  // floating text
  for(const f of G.floats){
    ctx.globalAlpha = clamp(f.life,0,1);
    outlineText(f.text, W/2, f.y - G.camY, 24, f.color, 'center');
    ctx.globalAlpha = 1;
  }
}

function drawBanner(){

  const b = G.banner;
  const t = 1.5 - b.life;
  const pop = t < 0.18 ? (t/0.18) : 1;

  g.addColorStop(0,'#eda033'); g.addColorStop(0.46,'#dd8228');
  g.addColorStop(0.5,'#a31f22'); g.addColorStop(1,'#7a1418');
  ctx.fillStyle = g; ctx.fillText(txt,0,0);
  // arrow
  const w = ctx.measureText(txt).width;
  ctx.save();
  ctx.translate(w/2 + 40, -34);
  ctx.beginPath();
  ctx.moveTo(-14,26); ctx.lineTo(-14,4); ctx.lineTo(-26,4); ctx.lineTo(2,-26);
  ctx.lineTo(30,4); ctx.lineTo(18,4); ctx.lineTo(18,26); ctx.closePath();
  ctx.strokeStyle = '#c9902a'; ctx.lineWidth = 18; ctx.stroke();
  ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 9; ctx.stroke();
  ctx.fillStyle = '#a31f22'; ctx.fill();
  ctx.restore();
  ctx.restore();
  // subtitle
  ctx.save(); ctx.globalAlpha = alpha;
  outlineText(b.name, W/2, H*0.24 + 46, 22, b.color, 'center');
  outlineText(b.sub, W/2, H*0.24 + 70, 15, '#e9f3ff', 'center');
  ctx.restore();
}

function render(){
  ctx.save();
  if(G.shake > 0){
    ctx.translate((Math.random()-0.5)*G.shake, (Math.random()-0.5)*G.shake);
  }
  ctx.translate(0, -G.camY);
  drawSky();
  drawClouds(false);
  drawSea();
  for(const is of G.islands) drawIsland(is);
  for(const c of G.clouds) drawBounceCloud(c);
  for(const p of G.pickups) drawPickup(p);
  drawJet();
  for(const q of G.puffs){
    ctx.globalAlpha = clamp(q.life,0,1);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.283); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawClouds(true);
  ctx.restore();
  drawHUD();
  drawBanner();
}

// ---------- loop ----------
let last = performance.now();
function frame(now){
  const dt = clamp((now - last)/16.667, 0, 2.5) || 1;
  last = now;
  if(state === 'play') update(dt);
  else if(state === 'landing') updateLanding(dt);
  else if(state === 'landed'){ G.t += dt; commonTick(dt); }
  else { G.t += dt; }
  updateActionBtn();
  render();
  requestAnimationFrame(frame);
}

// ---------- screens ----------
const screenEl = document.getElementById('screen');
const cardEl = document.getElementById('card');

function showStart(){
  state = 'start';
  cardEl.innerHTML =
    '<h1>Sky Islands</h1><h2>Power Up!</h2>' +
    '<p>Fly the jet and find islands. Petrol burns as you fly — land on an island runway to fill up, or grab a petrol drum in the air.</p>' +
    '<p>Rocks, hills and the sea all bite. You have three flames.</p>' +
    '<p>Bounce off the red jump pads on the islands to reach the thin air — the sparkly clouds up there bounce you higher the higher you get, and gold pays more.</p>' +
    '<div class="keys"><span class="chip">▲ climb</span><span class="chip">▶ speed up</span><span class="chip">◀ slow down</span><span class="chip">LAND at the top</span></div>' +
    '<div class="stat">' + SAVE.bank + ' gold in the bank' + (G.best ? ' · best run ' + G.best : '') + '</div>' +
    '<p>Flying the ' + PL.name + ' over ' + TM.name + '</p>' +
    '<button class="go" id="startBtn">Take off</button>' +
    '<button class="go alt" id="shopBtn">Shop</button>';
  screenEl.classList.remove('hide');
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('shopBtn').addEventListener('click', openShop);
}
function start(){
  reset(); state = 'play'; last = performance.now();
  screenEl.classList.add('hide');
  blip(440,0.08,'square',0.04);
}
function gameOver(){
  state = 'over';
  const score = Math.floor(G.gold);
  SAVE.bank += score;
  if(score > G.best) G.best = score;
  saveBest();
  cardEl.innerHTML =
    '<h1>' + (G.ranDry ? 'Ran dry' : 'Down in the drink') + '</h1>' +
    '<div class="stat">' + score + ' gold</div>' +
    '<p>' + G.found + ' island' + (G.found===1?'':'s') + ' found · ' + G.landings + ' landing' + (G.landings===1?'':'s') + ' · ' + Math.floor(G.dist/100) + ' km flown</p>' +
    '<p>Best run ' + G.best + ' gold · ' + SAVE.bank + ' gold in the bank</p>' +
    '<button class="go" id="againBtn">Fly again</button>' +
    '<button class="go alt" id="shopBtn2">Shop</button>';
  screenEl.classList.remove('hide');
  document.getElementById('againBtn').addEventListener('click', start);
  document.getElementById('shopBtn2').addEventListener('click', openShop);
}

// ---------- shop ----------
const shopEl = document.getElementById('shop');
const shopList = document.getElementById('shopList');
const shopGold = document.getElementById('shopGold');
let shopTab = 'planes';

function previewPlane(cv, pl){
  const c = cv.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  c.clearRect(0,0,cv.width,cv.height);
  const w = cv.width/2, h = cv.height/2;
  c.save(); c.translate(w*0.52, h*0.55); c.scale(0.52,0.52);
  drawPlaneShape(c, pl);
  c.restore();
}
function previewTheme(cv, th){
  const c = cv.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  const w = cv.width/2, h = cv.height/2, sy = h*0.78;
  const g = c.createLinearGradient(0,0,0,sy);
  g.addColorStop(0,th.sky[0]); g.addColorStop(0.45,th.sky[1]); g.addColorStop(0.82,th.sky[2]); g.addColorStop(1,th.sky[3]);
  c.fillStyle = g; c.fillRect(0,0,w,sy);
  const sg = c.createLinearGradient(0,sy,0,h);
  sg.addColorStop(0,th.sea[0]); sg.addColorStop(1,th.sea[1]);
  c.fillStyle = sg; c.fillRect(0,sy,w,h-sy);
  // cloud
  c.fillStyle = th.cloud;
  c.beginPath(); c.ellipse(w*0.22,h*0.22,13,7,0,0,6.283); c.ellipse(w*0.32,h*0.25,10,6,0,0,6.283); c.fill();
  // island
  const bx = w*0.34, bw = w*0.44;
  c.fillStyle = th.grass; c.fillRect(bx, sy-20, bw, 22);
  c.fillRect(bx+10, sy-30, bw-26, 12);
  c.fillStyle = th.grassTop; c.fillRect(bx, sy-20, bw, 4); c.fillRect(bx+10, sy-30, bw-26, 4);
  c.fillStyle = th.sand; c.fillRect(bx-4, sy-8, bw+8, 10);
  c.fillStyle = th.rock; c.fillRect(bx+bw-16, sy-42, 8, 34);
  c.fillStyle = th.rockTop; c.fillRect(bx+bw-16, sy-42, 8, 4);
  c.fillStyle = th.trunk; c.fillRect(bx+16, sy-36, 3, 7);
  c.fillStyle = th.leaf; c.fillRect(bx+12, sy-44, 11, 8);
  c.fillStyle = th.run; c.fillRect(bx+22, sy-32, 26, 4);
  c.fillStyle = th.foam; c.fillRect(bx-6, sy+1, bw+12, 3);
}

function bars(pl){
  const set = [['SPD', pl.spd/1.3],['LIFT', pl.lift/1.3],['FUEL', (1.3-pl.burn)/0.75]];
  return '<div class="bars">' + set.map(([k,v]) =>
    '<span>'+k+'</span><b><i style="width:'+Math.round(clamp(v,0.12,1)*100)+'%"></i></b>').join('') + '</div>';
}

function renderShop(){
  shopGold.textContent = SAVE.bank;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === shopTab));
  const planes = shopTab === 'planes';
  const items = planes ? PLANES : THEMES;
  const ownedMap = planes ? SAVE.planes : SAVE.themes;
  const equipped = planes ? SAVE.plane : SAVE.theme;
  shopList.innerHTML = items.map(it => {
    const owned = !!ownedMap[it.id], eq = equipped === it.id;
    const label = eq ? 'Equipped' : owned ? 'Use it' : (SAVE.bank >= it.price ? 'Buy ' + it.price : it.price + ' gold');
    const dis = eq || (!owned && SAVE.bank < it.price);
    return '<div class="item' + (eq ? ' eq' : '') + '">' +
      '<canvas width="320" height="150" data-id="' + it.id + '"></canvas>' +
      '<div class="nm">' + it.name + '</div>' +
      '<div class="ds">' + it.desc + '</div>' +
      (planes ? bars(it) : '') +
      '<button class="' + (owned ? 'own' : '') + '" data-id="' + it.id + '"' + (dis ? ' disabled' : '') + '>' + label + '</button>' +
      '</div>';
  }).join('');
  shopList.querySelectorAll('canvas').forEach(cv => {
    const it = items.find(i => i.id === cv.dataset.id);
    if(planes) previewPlane(cv, it); else previewTheme(cv, it);
  });
}

shopList.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  const planes = shopTab === 'planes';
  const items = planes ? PLANES : THEMES;
  const ownedMap = planes ? SAVE.planes : SAVE.themes;
  const it = items.find(i => i.id === b.dataset.id); if(!it) return;
  if(!ownedMap[it.id]){
    if(SAVE.bank < it.price) return;
    SAVE.bank -= it.price; ownedMap[it.id] = 1;
    blip(880,0.1,'square',0.05); setTimeout(()=>blip(1320,0.14,'square',0.045), 90);
  } else blip(660,0.08,'triangle',0.04);
  if(planes) SAVE.plane = it.id; else SAVE.theme = it.id;
  applyEquip(); persist(); renderShop();
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  shopTab = t.dataset.tab; renderShop();
}));
document.getElementById('shopClose').addEventListener('click', closeShop);

const codeIn = document.getElementById('codeIn');
const codeMsg = document.getElementById('codeMsg');
function redeem(){
  const key = (codeIn.value || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const c = CODES[key];
  if(!c){
    codeMsg.textContent = 'That code does nothing.'; codeMsg.classList.add('bad');
    blip(180,0.18,'sawtooth',0.04); return;
  }
  if(c.once && SAVE.codes[key]){
    codeMsg.textContent = 'Already used that one.'; codeMsg.classList.add('bad');
    blip(300,0.12,'triangle',0.04); return;
  }
  c.run(); SAVE.codes[key] = 1; applyEquip(); persist(); renderShop();
  codeIn.value = '';
  codeMsg.classList.remove('bad'); codeMsg.textContent = c.msg;
  blip(880,0.1,'square',0.05); setTimeout(()=>blip(1320,0.14,'square',0.05), 90);
  setTimeout(()=>blip(1760,0.16,'square',0.045), 190);
}
document.getElementById('codeGo').addEventListener('click', redeem);
codeIn.addEventListener('keydown', e => { if(e.key === 'Enter') redeem(); });

function openShop(){ renderShop(); screenEl.classList.add('hide'); shopEl.classList.remove('hide'); }
function closeShop(){
  shopEl.classList.add('hide');
  if(state === 'start') showStart(); else if(state === 'over') screenEl.classList.remove('hide');
}

// ---------- land / take off button ----------
const actBtn = document.getElementById('btnAct');
function updateActionBtn(){
  let label = '';
  if(state === 'play' && stripUnder()) label = 'LAND';
  else if(state === 'landed') label = 'TAKE OFF';
  if(label){
    if(actBtn.textContent !== label) actBtn.textContent = label;
    actBtn.classList.add('show');
  } else actBtn.classList.remove('show');
}
actBtn.addEventListener('click', e => {
  e.preventDefault();
  if(state === 'play') beginLanding();
  else if(state === 'landed') takeOff();
});

// ---------- input ----------
function bind(el, key){
  const on = e => { e.preventDefault(); input[key] = true; el.classList.add('on');
    try{ el.setPointerCapture(e.pointerId); }catch(err){} };
  const off = e => { input[key] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('lostpointercapture', off);
  el.addEventListener('contextmenu', e => e.preventDefault());
}
bind(document.getElementById('btnU'), 'up');
bind(document.getElementById('btnL'), 'left');
bind(document.getElementById('btnR'), 'right');
window.addEventListener('pointerup', () => {
  input.up = input.left = input.right = false;
  document.querySelectorAll('.rb').forEach(b => b.classList.remove('on'));
});
window.addEventListener('keydown', e => {
  if(e.repeat) return;
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w'||k===' ') { input.up = true; e.preventDefault(); }
  if(k==='arrowleft'||k==='a') input.left = true;
  if(k==='arrowright'||k==='d') input.right = true;
  if(k==='enter' && state !== 'play') start();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(k==='arrowup'||k==='w'||k===' ') input.up = false;
  if(k==='arrowleft'||k==='a') input.left = false;
  if(k==='arrowright'||k==='d') input.right = false;
});
document.addEventListener('visibilitychange', () => {
  input.up = input.left = input.right = false;
  last = performance.now();
});

// ---------- go ----------
resize();
loadBest();
reset();
showStart();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
