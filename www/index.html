    '<p class="small-note">'+SAVE.bank+' gold in the bank · '+(flightMode==='daily'?'Today’s best '+(SAVE.dailyBest[courseId()]||0):'Best flight '+SAVE.best)+'<br>Course '+courseId()+' · missions reset at midnight UTC</p></section>'+
    '<section><h3>Today’s missions</h3>'+missionHTML()+'<p class="small-note">Mission rewards go straight to your bank.</p></section></div>'+
    '<div class="actions brief-footer"><button class="go" id="startBtn">'+(!SAVE.tutorial?'Learn to fly':flightMode==='daily'?'Race today':'Take off')+'</button><button class="minor" id="shopBtn">Hangar</button><button class="minor" id="logBtn">Logbook</button><button class="minor" id="settingsBtn">Settings</button>'+ (SAVE.tutorial?'<button class="minor" id="trainingBtn">Training</button>':'<button class="minor" id="skipTraining">Skip training</button>')+'</div>';
  document.getElementById('ghostChoice').value=SAVE.settings.ghost;
  document.getElementById('ghostChoice').onchange=e=>{SAVE.settings.ghost=e.target.value; persist();};
  document.getElementById('startBtn').onclick=()=>{ if(!SAVE.tutorial) flightMode='tutorial'; start(); };
  document.getElementById('freeMode').onclick=()=>{flightMode='free'; showStart();};
  document.getElementById('dailyMode').onclick=()=>{flightMode='daily'; showStart();};
  document.getElementById('shopBtn').onclick=openShop;
  document.getElementById('logBtn').onclick=showLogbook;
  document.getElementById('settingsBtn').onclick=showSettings;
  if(SAVE.tutorial) document.getElementById('trainingBtn').onclick=()=>{flightMode='tutorial'; start();};
  else document.getElementById('skipTraining').onclick=()=>{SAVE.tutorial=true; persist(); showStart();};
  screenEl.classList.remove('hide');
}
function ghostKey(){return RULESET+':'+G.course+':'+G.mode+':'+PL.id;}
function start(){
  unlockAudio(); clearInput(); flightSerial++;
  reset(); state='play'; last=performance.now(); accumulator=0;
  screenEl.classList.add('hide'); document.getElementById('panel').classList.add('hide');
  document.getElementById('flightBar').classList.remove('hide');
  if(G.mode==='tutorial') { G.pickups=[]; G.nextPickup=10000000; }
  blip(440,.08,'square',.04); loadGhosts(G.course); updateTutorialHint();
}
function loadGhosts(course){
  const serial=flightSerial, choice=SAVE.settings.ghost;
  G.ghostChoice=choice;
  if(choice==='none'||G.mode==='tutorial') return;
  const mine=SAVE.ghosts[ghostKey()];
  if(mine && Array.isArray(mine.track)) G.ghosts=[{...mine,you:true,plane:PL.id}];
  if(G.mode!=='daily'){ G.ghostStatus=mine?'Racing your best':'Finish a flight to record your ghost'; return; }
  G.ghostStatus=choice==='rival'?'Finding a rival…':'Loading your ghost…';
  api('/api/v2/ghosts?course='+encodeURIComponent(course)+'&player_id='+encodeURIComponent(SAVE.pid)+'&selection='+choice+'&ruleset='+RULESET)
    .then(res=>{
      if(serial!==flightSerial||G.ended) return;
      const ghosts=(res.ghosts||[]).filter(g=>Array.isArray(g.track)&&g.track.length>=4);
      if(ghosts.length) G.ghosts=ghosts;
      G.ghostStatus=ghosts.length?'':G.ghosts.length?'Racing your saved best':'No ghost yet — set the first flight!';
    }).catch(()=>{if(serial===flightSerial) G.ghostStatus=G.ghosts.length?'Offline · racing your saved best':'Offline · your race still counts locally';});
}
function gameOver(){
  if(G.ended) return;
  G.ended=true; state='over'; clearInput();
  document.getElementById('flightBar').classList.add('hide');
  document.getElementById('tutorialHint').classList.add('hide');
  const score=Math.floor(G.gold), key=ghostKey();
  if(G.mode!=='tutorial'){
    SAVE.bank+=score;
    if(G.mode==='daily') SAVE.dailyBest[G.course]=Math.max(score,SAVE.dailyBest[G.course]||0);
    else if(!G.assisted && score>SAVE.best) SAVE.best=score;
    if(!G.assisted && G.runT<=600 && (!SAVE.ghosts[key]||score>SAVE.ghosts[key].score)){
      SAVE.ghosts[key]={score,track:G.rec.slice(),name:'Your best',plane:PL.id};
      const keys=Object.keys(SAVE.ghosts); while(keys.length>8) delete SAVE.ghosts[keys.shift()];
    }
    for(const old of Object.keys(SAVE.dailyBest).sort().slice(0,-30)) delete SAVE.dailyBest[old];
  }
  G.best=SAVE.best; persist();
  cardEl.classList.remove('briefing');
  const ranked=G.mode==='daily'&&!G.assisted&&G.rec.length>=4;
  cardEl.innerHTML='<div class="body"><h1>'+esc(G.reason||(G.ranDry?'Ran dry':'Flight over'))+'</h1><div class="stat">'+score+' gold</div>'+
    '<p>'+G.found+' islands · '+G.rings+' rings · '+G.deliveries+' deliveries<br>'+Math.floor(G.dist/100)+' km flown · '+G.landings+' landings</p>'+
    '<p>'+SAVE.bank+' gold in the bank'+(G.rewardGold?' · '+G.rewardGold+' mission bonus already banked':'')+'</p>'+
    (ranked?'<div id="lb"></div>':'<p class="small-note">'+(G.assisted?'Assisted Free Flight · excluded from records and rankings':'Your best ghost is saved on this device. Try Daily Race to compete online.')+'</p>')+
    '</div><div class="actions"><button class="go" id="againBtn">Fly again</button><button class="go alt" id="homeBtn">Flight club</button></div>';
  document.getElementById('againBtn').onclick=start;
  document.getElementById('homeBtn').onclick=showStart;
  screenEl.classList.remove('hide');
  if(ranked) mountLeaderboard({score,islands:G.found,landings:G.landings,km:Math.floor(G.dist/100),course:G.course,track:G.rec,plane:PL.id,mode:'daily',assisted:false,ruleset:RULESET,duration:Math.min(DAILY_SECONDS,G.runT)});
}

// ---------- shop ----------
const shopEl = document.getElementById('shop');
const shopList = document.getElementById('shopList');
const shopGold = document.getElementById('shopGold');
let shopTab = 'planes';

function previewPlane(cv, pl){
  const c = cv.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  c.clearRect(0,0,cv.width,cv.height);
  const w = cv.width/2, h = cv.height/2;
  c.save(); c.translate(w*0.52, h*0.55); c.scale(0.52,0.52);
  drawPlaneShape(c, pl);
  c.restore();
}
function previewTheme(cv, th){
  const c = cv.getContext('2d');
  c.setTransform(2,0,0,2,0,0);
  const w = cv.width/2, h = cv.height/2, sy = h*0.78;
  const g = c.createLinearGradient(0,0,0,sy);
  g.addColorStop(0,th.sky[0]); g.addColorStop(0.45,th.sky[1]); g.addColorStop(0.82,th.sky[2]); g.addColorStop(1,th.sky[3]);
  c.fillStyle = g; c.fillRect(0,0,w,sy);
  const sg = c.createLinearGradient(0,sy,0,h);
  sg.addColorStop(0,th.sea[0]); sg.addColorStop(1,th.sea[1]);
  c.fillStyle = sg; c.fillRect(0,sy,w,h-sy);
  // cloud
  c.fillStyle = th.cloud;
  c.beginPath(); c.ellipse(w*0.22,h*0.22,13,7,0,0,6.283); c.ellipse(w*0.32,h*0.25,10,6,0,0,6.283); c.fill();
  // island
  const bx = w*0.34, bw = w*0.44;
  c.fillStyle = th.grass; c.fillRect(bx, sy-20, bw, 22);
  c.fillRect(bx+10, sy-30, bw-26, 12);
  c.fillStyle = th.grassTop; c.fillRect(bx, sy-20, bw, 4); c.fillRect(bx+10, sy-30, bw-26, 4);
  c.fillStyle = th.sand; c.fillRect(bx-4, sy-8, bw+8, 10);
  c.fillStyle = th.rock; c.fillRect(bx+bw-16, sy-42, 8, 34);
  c.fillStyle = th.rockTop; c.fillRect(bx+bw-16, sy-42, 8, 4);
  c.fillStyle = th.trunk; c.fillRect(bx+16, sy-36, 3, 7);
  c.fillStyle = th.leaf; c.fillRect(bx+12, sy-44, 11, 8);
  c.fillStyle = th.run; c.fillRect(bx+22, sy-32, 26, 4);
  c.fillStyle = th.foam; c.fillRect(bx-6, sy+1, bw+12, 3);
}

function bars(pl){
  const set = [['Speed', pl.spd/1.3],['Lift', pl.lift/1.3],['Economy', (1.3-pl.burn)/0.75]];
  return '<div class="bars">' + set.map(([k,v]) =>
    '<span>'+k+'</span><b><i style="width:'+Math.round(clamp(v,0.12,1)*100)+'%"></i></b>').join('') + '</div>';
}

function renderShop(){
  shopGold.textContent = SAVE.bank;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === shopTab));
  const planes = shopTab === 'planes';
  const items = planes ? PLANES : THEMES;
  const ownedMap = planes ? SAVE.planes : SAVE.themes;
  const equipped = planes ? SAVE.plane : SAVE.theme;
  shopList.innerHTML = items.map(it => {
    const owned = !!ownedMap[it.id], eq = equipped === it.id;
    const label = eq ? 'Equipped' : owned ? 'Use it' : (SAVE.bank >= it.price ? 'Buy ' + it.price : it.price + ' gold');
    const dis = eq || (!owned && SAVE.bank < it.price);
    return '<div class="item' + (eq ? ' eq' : '') + '">' +
      '<canvas width="320" height="150" data-id="' + it.id + '"></canvas>' +
      '<div class="nm">' + it.name + '</div>' +
      '<div class="ds">' + it.desc + '</div>' +
      (planes ? bars(it) : '') +
      '<button class="' + (owned ? 'own' : '') + '" data-id="' + it.id + '"' + (dis ? ' disabled' : '') + '>' + label + '</button>' +
      '</div>';
  }).join('');
  shopList.querySelectorAll('canvas').forEach(cv => {
    const it = items.find(i => i.id === cv.dataset.id);
    if(planes) previewPlane(cv, it); else previewTheme(cv, it);
  });
}

shopList.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b || b.disabled) return;
  const planes = shopTab === 'planes';
  const items = planes ? PLANES : THEMES;
  const ownedMap = planes ? SAVE.planes : SAVE.themes;
  const it = items.find(i => i.id === b.dataset.id); if(!it) return;
  if(!ownedMap[it.id]){
    if(SAVE.bank < it.price) return;
    SAVE.bank -= it.price; ownedMap[it.id] = 1;
    blip(880,0.1,'square',0.05); setTimeout(()=>blip(1320,0.14,'square',0.045), 90);
  } else blip(660,0.08,'triangle',0.04);
  if(planes) SAVE.plane = it.id; else SAVE.theme = it.id;
  applyEquip(); persist(); renderShop();
});
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  shopTab = t.dataset.tab; renderShop();
}));
document.getElementById('shopClose').addEventListener('click', closeShop);

const codeIn = document.getElementById('codeIn');
const codeMsg = document.getElementById('codeMsg');
function redeem(){
  const key = (codeIn.value || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const c = CODES[key];
  if(!c){
    codeMsg.textContent = 'That code does nothing.'; codeMsg.classList.add('bad');
    blip(180,0.18,'sawtooth',0.04); return;
  }
  if(c.once && SAVE.codes[key]){
    codeMsg.textContent = 'Already used that one.'; codeMsg.classList.add('bad');
    blip(300,0.12,'triangle',0.04); return;
  }
  c.run(); SAVE.codes[key] = 1; applyEquip(); persist(); renderShop();
  codeIn.value = '';
  codeMsg.classList.remove('bad'); codeMsg.textContent = c.msg;
  blip(880,0.1,'square',0.05); setTimeout(()=>blip(1320,0.14,'square',0.05), 90);
  setTimeout(()=>blip(1760,0.16,'square',0.045), 190);
}
document.getElementById('codeGo').addEventListener('click', redeem);
codeIn.addEventListener('keydown', e => { if(e.key === 'Enter') redeem(); });

function openShop(){ applyEquip(); renderShop(); screenEl.classList.add('hide'); shopEl.classList.remove('hide'); }
function closeShop(){
  shopEl.classList.add('hide');
  if(state === 'start') showStart(); else if(state === 'over') screenEl.classList.remove('hide');
}

// ---------- land / take off button ----------
const actBtn = document.getElementById('btnAct');
function updateActionBtn(){
  let label = '';
  if(state === 'play' && stripUnder()) label = 'LAND';
  else if(state === 'landed') label = 'TAKE OFF';
  if(label){
    if(actBtn.textContent !== label) actBtn.textContent = label;
    actBtn.classList.add('show');
  } else actBtn.classList.remove('show');
}
actBtn.addEventListener('click', e => {
  e.preventDefault();
  if(state === 'play') beginLanding();
  else if(state === 'landed') takeOff();
});

// ---------- input: each pointer and keyboard key owns only its own control ----------
const touchPointers={up:new Set(),left:new Set(),right:new Set()}, keyboardKeys=new Set();
function syncInput(){
  for(const [key,id,keys] of [['up','btnU',['arrowup','w',' ']],['left','btnL',['arrowleft','a']],['right','btnR',['arrowright','d']]]){
    input[key]=touchPointers[key].size>0||keys.some(k=>keyboardKeys.has(k));
    document.getElementById(id).classList.toggle('on',input[key]);
  }
}
function bind(el,key){
  el.addEventListener('pointerdown',e=>{
    if(state!=='play') return;
    e.preventDefault(); touchPointers[key].add(e.pointerId); syncInput();
    try{el.setPointerCapture(e.pointerId);}catch(err){}
  });
  const off=e=>{touchPointers[key].delete(e.pointerId); syncInput();};
  for(const type of ['pointerup','pointercancel','lostpointercapture']) el.addEventListener(type,off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind(document.getElementById('btnU'),'up'); bind(document.getElementById('btnL'),'left'); bind(document.getElementById('btnR'),'right');
for(const type of ['pointerup','pointercancel']) window.addEventListener(type,e=>{
  for(const pointers of Object.values(touchPointers)) pointers.delete(e.pointerId); syncInput();
});
window.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,button')||e.repeat) return;
  const k=e.key.toLowerCase();
  if(k==='escape'||k==='p'){ if(state==='paused') resumeFlight(); else pauseFlight(); e.preventDefault(); return; }
  if(state!=='play') return;
  if(['arrowup','arrowleft','arrowright','w','a','d',' '].includes(k)){keyboardKeys.add(k); syncInput(); e.preventDefault();}
  if(k==='enter') beginLanding();
});
window.addEventListener('keyup',e=>{keyboardKeys.delete(e.key.toLowerCase()); syncInput();});
window.addEventListener('blur',()=>{clearInput(); pauseFlight();});
document.addEventListener('visibilitychange',()=>{
  clearInput(); last=performance.now(); accumulator=0;
  if(document.hidden) pauseFlight();
});
document.getElementById('pauseBtn').onclick=pauseFlight;

// ---------- go ----------
resize();
loadBest();
reset();
showStart();
requestAnimationFrame(frame);
})();
</script>
</body>
